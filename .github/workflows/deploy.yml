name: deploy

# GitHub бачить workflow ЛИШЕ в .github/workflows у КОРЕНІ репозиторію.
# Цей файл — канонічний (репо-корінь = тека КонтентГров, усередині — /server).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on Hetzner via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.APP_DIR }}        # напр. /opt/kontentgrov (клон репо)
            git pull origin main
            cd server
            docker compose up -d --build
            docker image prune -f
