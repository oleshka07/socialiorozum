name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on Hetzner via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.APP_DIR }}"
            git pull origin main
            cd server
            docker compose up -d --build
            docker image prune -f
            # 🛡 KEEPALIVE проти сторонніх зачисток. 28.07 контейнери socialio знесло чужим деплоєм
            # на цьому ж боксі (`Creating` замість `Running` у логу) - і вони НЕ повернулись самі:
            # `restart: unless-stopped` не воскрешає ВИДАЛЕНИЙ контейнер. Ставимо host-cron, який
            # раз на 10 хв ідемпотентно піднімає обидва стеки: якщо все живе, `up -d` не робить нічого.
            # Пишемо через деплой, бо це єдиний наш канал до хоста; крок навмисно НЕ валить деплой.
            if command -v crontab >/dev/null 2>&1; then
              cat > /opt/socialio-keepalive.sh <<'KEEPSH'
            #!/bin/sh
            # піднімає стеки socialio, якщо їх знесли. --build у фолбеку: якщо образ теж запрунили,
            # без нього compose скаже «image not found» і нічого не підніме.
            for d in /opt/socialio/server /opt/socialio-beta/server; do
              [ -d "$d" ] || continue
              cd "$d" || continue
              docker compose up -d >/dev/null 2>&1 || docker compose up -d --build >/dev/null 2>&1
            done
            date -u "+%Y-%m-%dT%H:%M:%SZ keepalive ok" > /opt/socialio-keepalive.log
            KEEPSH
              sed -i 's/^            //' /opt/socialio-keepalive.sh
              chmod +x /opt/socialio-keepalive.sh
              ( crontab -l 2>/dev/null | grep -v socialio-keepalive ; echo "*/10 * * * * /opt/socialio-keepalive.sh" ) | crontab - \
                && echo "🛡 keepalive-cron на місці (*/10 хв)" || echo "⚠️ не вдалося поставити cron - перевір вручну"
            else
              echo "⚠️ crontab на хості немає - keepalive не встановлено"
            fi
            # 📋 Інвентар хоста. Бокс один на всі сервіси, тож коли щось «зникає» (28.07 контейнери
            # socialio знесло цілком - compose створював їх з нуля), треба бачити, ЩО саме лишилось.
            # Найважливіше - ТОМИ: видалення контейнера дані НЕ втрачає, а видалення тому втрачає.
            echo "--- контейнери на хості ---"; docker ps -a --format '{{.Names}}\t{{.Status}}\t{{.Image}}'
            echo "--- томи (CreatedAt свіжий = дані втрачені) ---"
            for v in $(docker volume ls -q); do echo "$v  $(docker volume inspect -f '{{.CreatedAt}}' "$v")"; done
            echo "--- диск ---";  df -h / | tail -1
            echo "--- памʼять ---"; free -h | head -2
            # ⚠️ `up -d` НЕ доказ, що застосунок працює: healthcheck є лише в БД, тож контейнер
            # застосунку рахується «Started» одразу після запуску процесу. Якщо він упаде на міграції
            # чи на старті воркерів, деплой лишався ЗЕЛЕНИМ і про це ніхто не дізнавався до першого
            # відкриття кабінету. Чекаємо на живий /health (прод слухає 8080).
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080/health" || true)
              if [ "$code" = "200" ]; then echo "✅ health 200 (спроба $i)"; exit 0; fi
              sleep 2
            done
            echo "❌ застосунок не віддав health 200 за 60с"
            echo "--- стан контейнерів проєкту ---"; docker compose ps
            echo "--- логи застосунку ---"; docker compose logs --tail=60 app
            exit 1
