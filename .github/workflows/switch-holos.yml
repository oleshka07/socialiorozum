name: switch-holos

# РАЗОВЕ перемикання ПРОДУ на нову адресу holos.rozum.one (запуск: push у гілку switch-holos).
# Запускати ЛИШЕ після: (1) Holos уже на проді (промоушн beta → main), (2) явне «так» власника.
# Адреси повернення OAuth (Meta, Threads, LinkedIn, Google) на holos варто додати ДО: без них нові
# підключення мереж не пройдуть, хоча вже підключені мережі публікують як і раніше. Кроки:
#   1) vhost holos.rozum.one → той самий застосунок, що й socialio.rozum.one (копія конфігу socialio
#      з іншою назвою; сертифікат holos уже є); увімкнений конфіг старого Holos - у резервну копію;
#   2) APP_BASE_URL у .env проду → https://holos.rozum.one (.env - у резервну копію);
#   3) перезапуск застосунку, перевірка обох адрес.
# socialio.rozum.one не вимикається: сторінки звідти застосунок сам перекидає на holos (301), а вебхуки,
# конектори Claude, медіа й Mini App працюють як і раніше. Відкат - команда в кінці логу.

on:
  push:
    branches: [switch-holos]

jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - name: Switch prod to holos.rozum.one
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            PROD_DIR="${{ secrets.APP_DIR }}"
            SUDO=""; [ "$(id -u)" != "0" ] && SUDO="sudo -n"
            STAMP=$(date +%Y%m%d-%H%M%S)
            BK=/root/holos-switch-$STAMP
            $SUDO mkdir -p "$BK/enabled"

            echo "== 0/3: передумови =="
            test -f "$PROD_DIR/server/src/brand.ts" || { echo "На проді ще старий код без Holos - спершу промоушн beta → main."; exit 1; }
            SOC=$(readlink -f /etc/nginx/sites-enabled/socialio.rozum.one.conf)
            test -f "$SOC" || { echo "Нема конфігу nginx для socialio.rozum.one"; exit 1; }
            $SUDO test -f /etc/letsencrypt/live/holos.rozum.one/fullchain.pem || { echo "Нема сертифіката holos.rozum.one"; exit 1; }
            grep -q "proxy_set_header Host" "$SOC" || echo "УВАГА: конфіг socialio не передає Host - редірект зі старої адреси не спрацює (сайт при цьому працює)"

            echo "== 1/3: nginx - holos.rozum.one → застосунок проду =="
            # увімкнені конфіги з server_name holos.rozum.one (старий проєкт Holos, 502) - у резервну копію
            # і вимкнути, інакше nginx матиме два сервери з однією назвою; beta.holos не чіпаємо
            for f in /etc/nginx/sites-enabled/*; do
              [ -e "$f" ] || [ -L "$f" ] || continue
              if $SUDO grep -qE "server_name([[:space:]]+[^;[:space:]]+)*[[:space:]]+holos\.rozum\.one([[:space:];]|$)" "$f" 2>/dev/null; then
                $SUDO cp -a "$f" "$BK/enabled/"
                echo "вимикаю старий конфіг: $f -> $(readlink -f "$f")"
                $SUDO rm -f "$f"
              fi
            done
            TARGET=/etc/nginx/sites-available/holos.rozum.one.conf
            if [ -f "$TARGET" ]; then $SUDO cp -a "$TARGET" "$BK/holos.rozum.one.conf.available"; fi
            # копія конфігу socialio (той самий застосунок і ті самі ліміти); ipv6only і default_server
            # можна вказати лише в одному сервері на адресу - у копії їх прибираємо
            sed -e 's/socialio\.rozum\.one/holos.rozum.one/g' -e 's/ ipv6only=on//g' -e 's/ default_server//g' "$SOC" | $SUDO tee "$TARGET" >/dev/null
            $SUDO ln -sf "$TARGET" /etc/nginx/sites-enabled/holos.rozum.one.conf
            if ! $SUDO nginx -t; then
              echo "nginx -t не пройшов - повертаю як було"
              $SUDO rm -f /etc/nginx/sites-enabled/holos.rozum.one.conf
              if [ -f "$BK/holos.rozum.one.conf.available" ]; then $SUDO cp -a "$BK/holos.rozum.one.conf.available" "$TARGET"; else $SUDO rm -f "$TARGET"; fi
              $SUDO cp -a "$BK/enabled/." /etc/nginx/sites-enabled/ 2>/dev/null || true
              exit 1
            fi
            $SUDO systemctl reload nginx
            echo "nginx: OK"

            echo "== 2/3: APP_BASE_URL проду → https://holos.rozum.one =="
            ENVF="$PROD_DIR/server/.env"
            $SUDO cp -a "$ENVF" "$BK/.env"
            $SUDO chmod 600 "$BK/.env"
            if grep -q '^APP_BASE_URL=' "$ENVF"; then
              $SUDO sed -i -E 's|^APP_BASE_URL=.*|APP_BASE_URL=https://holos.rozum.one|' "$ENVF"
            else
              echo 'APP_BASE_URL=https://holos.rozum.one' | $SUDO tee -a "$ENVF" >/dev/null
            fi
            grep '^APP_BASE_URL=' "$ENVF"

            echo "== 3/3: перезапуск і перевірка =="
            cd "$PROD_DIR/server"
            docker compose up -d --force-recreate --no-deps app
            ok=""
            for i in $(seq 1 45); do
              if curl -fsS 127.0.0.1:8080/health >/dev/null 2>&1; then ok=1; break; fi
              sleep 2
            done
            [ -n "$ok" ] || { echo "health: FAIL"; docker compose logs --tail=40 app; exit 1; }
            echo "health: OK"
            sleep 3
            H=$(curl -sS -m 15 -o /dev/null -w '%{http_code}' https://holos.rozum.one/health || true)
            echo "https://holos.rozum.one/health -> $H"
            echo "https://holos.rozum.one/     -> $(curl -sS -m 15 -o /dev/null -w '%{http_code}' https://holos.rozum.one/ || true)"
            echo "https://holos.rozum.one/app  -> $(curl -sS -m 15 -o /dev/null -w '%{http_code}' https://holos.rozum.one/app || true)"
            R=$(curl -sS -m 15 -o /dev/null -w '%{http_code} %{redirect_url}' 'https://socialio.rozum.one/app?x=1' || true)
            echo "https://socialio.rozum.one/app?x=1 -> $R"
            echo "socialio /health (без редіректу) -> $(curl -sS -m 15 -o /dev/null -w '%{http_code}' https://socialio.rozum.one/health || true)"
            docker compose logs --tail=40 app | grep -i "tgbot" || true
            echo
            echo "Резервні копії: $BK"
            echo "ВІДКАТ: sudo cp -a $BK/.env $ENVF && sudo rm -f /etc/nginx/sites-enabled/holos.rozum.one.conf && sudo cp -a $BK/enabled/. /etc/nginx/sites-enabled/ ; sudo nginx -t && sudo systemctl reload nginx && cd $PROD_DIR/server && docker compose up -d --force-recreate --no-deps app"
            [ "$H" = "200" ] || { echo "holos.rozum.one/health не 200 - дивись вище"; exit 1; }
            echo "$R" | grep -q "^301 https://holos.rozum.one/app?x=1" || { echo "стара адреса не перекидає на нову - дивись вище"; exit 1; }
            echo "ПЕРЕМИКАННЯ ПРОДУ: OK"
