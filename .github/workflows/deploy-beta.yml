name: deploy-beta

# БЕТА: push у гілку beta → деплой на /opt/socialio-beta (beta.socialio.rozum.one).
# Ізольований стек: свій compose-проєкт (COMPOSE_PROJECT_NAME у .env бети), своя БД/медіа, порт 8081.
# Промоушн у прод: merge beta → main (спрацює звичайний deploy.yml).

on:
  push:
    branches: [beta]
  workflow_dispatch:

jobs:
  deploy-beta:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy BETA on Hetzner via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -e
            BETA_DIR="${{ secrets.APP_DIR }}-beta"
            if [ ! -d "$BETA_DIR" ]; then
              echo "beta не розгорнута на сервері ($BETA_DIR відсутня) - пропускаю (див. server/BETA.md)"
              exit 0
            fi
            cd "$BETA_DIR"
            git pull origin beta
            cd server
            docker compose up -d --build
            docker image prune -f
            # ⚠️ `up -d` НЕ доказ, що застосунок працює: healthcheck є лише в БД, тож контейнер
            # застосунку рахується «Started» одразу після запуску процесу. Якщо він упаде на міграції
            # чи на старті воркерів, деплой лишався ЗЕЛЕНИМ і про це ніхто не дізнавався до першого
            # відкриття кабінету. Тому явно чекаємо на живий /health.
            # порт бети - 8081 (APP_PORT живе в її .env, у цій ssh-сесії його нема, тож literal)
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8081/health" || true)
              if [ "$code" = "200" ]; then echo "✅ health 200 (спроба $i)"; exit 0; fi
              sleep 2
            done
            echo "❌ застосунок не віддав health 200 за 60с - останні логи:"
            docker compose logs --tail=40 app
            exit 1
