name: deploy-beta

# БЕТА: push у гілку beta → деплой на /opt/socialio-beta (beta.socialio.rozum.one).
# Ізольований стек: свій compose-проєкт (COMPOSE_PROJECT_NAME у .env бети), своя БД/медіа, порт 8081.
# Промоушн у прод: merge beta → main (спрацює звичайний deploy.yml).

on:
  push:
    branches: [beta]
  workflow_dispatch:

jobs:
  deploy-beta:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy BETA on Hetzner via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -e
            BETA_DIR="${{ secrets.APP_DIR }}-beta"
            if [ ! -d "$BETA_DIR" ]; then
              echo "beta не розгорнута на сервері ($BETA_DIR відсутня) - пропускаю (див. server/BETA.md)"
              exit 0
            fi
            cd "$BETA_DIR"
            git pull origin beta
            cd server
            docker compose up -d --build
            docker image prune -f
            # 🛡 KEEPALIVE проти сторонніх зачисток. 28.07 контейнери socialio знесло чужим деплоєм
            # на цьому ж боксі (`Creating` замість `Running` у логу) - і вони НЕ повернулись самі:
            # `restart: unless-stopped` не воскрешає ВИДАЛЕНИЙ контейнер. Ставимо host-cron, який
            # раз на 10 хв ідемпотентно піднімає обидва стеки: якщо все живе, `up -d` не робить нічого.
            # Пишемо через деплой, бо це єдиний наш канал до хоста; крок навмисно НЕ валить деплой.
            if command -v crontab >/dev/null 2>&1; then
              cat > /opt/socialio-keepalive.sh <<'KEEPSH'
            #!/bin/sh
            # піднімає стеки socialio, якщо їх знесли. --build у фолбеку: якщо образ теж запрунили,
            # без нього compose скаже «image not found» і нічого не підніме.
            for d in /opt/socialio/server /opt/socialio-beta/server; do
              [ -d "$d" ] || continue
              cd "$d" || continue
              docker compose up -d >/dev/null 2>&1 || docker compose up -d --build >/dev/null 2>&1
            done
            date -u "+%Y-%m-%dT%H:%M:%SZ keepalive ok" > /opt/socialio-keepalive.log
            KEEPSH
              sed -i 's/^            //' /opt/socialio-keepalive.sh
              chmod +x /opt/socialio-keepalive.sh
              ( crontab -l 2>/dev/null | grep -v socialio-keepalive ; echo "*/10 * * * * /opt/socialio-keepalive.sh" ) | crontab - \
                && echo "🛡 keepalive-cron на місці (*/10 хв)" || echo "⚠️ не вдалося поставити cron - перевір вручну"
            else
              echo "⚠️ crontab на хості немає - keepalive не встановлено"
            fi
            # 💾 БЕКАП на цьому ж боксі (блокер ④ з аудиту). Щоночі pg_dump бази + tar медіа-тому
            # в /opt/socialio-backups, ротація 14 днів. Це захист від помилкової міграції, кривого
            # деплою чи випадкового видалення - НЕ від втрати диска: копія поза сервером лишається
            # окремою задачею (CLAUDE.md §7). Ставиться через деплой, бо це єдиний наш канал до хоста.
            if command -v crontab >/dev/null 2>&1; then
              cat > /opt/socialio-backup.sh <<'BKSH'
            #!/bin/sh
            # Бекап обох стеків socialio. Дамп береться ЗСЕРЕДИНИ контейнера БД тим самим користувачем,
            # що задано в .env (нам не треба знати пароль - він уже в середовищі контейнера).
            set -u
            OUT=/opt/socialio-backups; mkdir -p "$OUT"; chmod 700 "$OUT"
            STAMP=$(date -u +%Y%m%d-%H%M)
            for d in /opt/socialio/server /opt/socialio-beta/server; do
              [ -d "$d" ] || continue
              cd "$d" || continue
              name=$(grep -E '^COMPOSE_PROJECT_NAME=' .env 2>/dev/null | cut -d= -f2); name=${name:-socialio}
              # база: pg_dump у custom-форматі (стискається, відновлюється pg_restore вибірково)
              if docker compose exec -T db sh -c 'pg_dump -U "$POSTGRES_USER" -Fc "$POSTGRES_DB"' > "$OUT/$name-db-$STAMP.dump" 2>/dev/null \
                 && [ -s "$OUT/$name-db-$STAMP.dump" ]; then echo "$STAMP $name db ok $(du -h "$OUT/$name-db-$STAMP.dump" | cut -f1)"
              else echo "$STAMP $name db FAILED"; rm -f "$OUT/$name-db-$STAMP.dump"; fi
              # медіа: том цілком (фото, відео, thumbs)
              if docker run --rm -v "${name}_media:/m:ro" -v "$OUT:/b" alpine tar czf "/b/$name-media-$STAMP.tgz" -C /m . 2>/dev/null; then
                echo "$STAMP $name media ok $(du -h "$OUT/$name-media-$STAMP.tgz" | cut -f1)"
              else echo "$STAMP $name media FAILED"; rm -f "$OUT/$name-media-$STAMP.tgz"; fi
            done
            # ротація: старше 14 днів - геть
            find "$OUT" -type f \( -name '*.dump' -o -name '*.tgz' \) -mtime +14 -delete
            df -h /opt | tail -1 | awk '{print "disk", $4, "free"}'
            BKSH
              sed -i 's/^            //' /opt/socialio-backup.sh
              chmod +x /opt/socialio-backup.sh
              ( crontab -l 2>/dev/null | grep -v socialio-backup ; echo "20 3 * * * /opt/socialio-backup.sh >> /opt/socialio-backup.log 2>&1" ) | crontab - \
                && echo "💾 backup-cron на місці (щоночі 03:20 UTC → /opt/socialio-backups, 14 днів)" || echo "⚠️ не вдалося поставити backup-cron"
              echo "--- останні бекапи ---"; ls -lh /opt/socialio-backups 2>/dev/null | tail -6 || echo "(ще жодного)"
            fi
            # ⚠️ `up -d` НЕ доказ, що застосунок працює: healthcheck є лише в БД, тож контейнер
            # застосунку рахується «Started» одразу після запуску процесу. Якщо він упаде на міграції
            # чи на старті воркерів, деплой лишався ЗЕЛЕНИМ і про це ніхто не дізнавався до першого
            # відкриття кабінету. Тому явно чекаємо на живий /health.
            # порт бети - 8081 (APP_PORT живе в її .env, у цій ssh-сесії його нема, тож literal)
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8081/health" || true)
              if [ "$code" = "200" ]; then
                echo "✅ health 200 (спроба $i)"
                # 🤖 Стан сайдкара підписки. Крок навмисно НЕ валить деплой: сайдкар опційний
                # (profiles: cli), і його відсутність означає лише «працюємо через API, як завжди».
                if docker compose ps --services 2>/dev/null | grep -q '^claude-cli$'; then
                  docker compose exec -T app wget -qO- --timeout=5 http://claude-cli:8090/health \
                    && echo "" || echo "⚠️ сайдкар claude-cli не відповідає - генерація піде через API"
                else
                  echo "ℹ️ claude-cli вимкнено (нема COMPOSE_PROFILES=cli у .env) - усе через API"
                fi
                exit 0
              fi
              sleep 2
            done
            echo "❌ застосунок не віддав health 200 за 60с"
            echo "--- стан контейнерів ---"; docker compose ps
            echo "--- диск ---";  df -h / | tail -1
            echo "--- памʼять ---"; free -h | head -2
            echo "--- логи застосунку ---"; docker compose logs --tail=60 app
            exit 1
