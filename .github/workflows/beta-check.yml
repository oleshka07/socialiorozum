name: beta-check

# Службова гілка. Лише ЧИТАННЯ сервера (діагностика) або заливка файлів у медіатеку кабінету через його ж
# разове посилання. 29.09: бета після монтажу відео - версія, здоров'я, маркери і ПРОБНИЙ МОНТАЖ ffmpeg у
# контейнері беті (тимчасова тека, нічого не пише ні в базу, ні в медіатеку): чи є в Alpine-ffmpeg усі
# фільтри (ass, zoompan, boxblur, loudnorm, amix, tpad, сегментатор) і шрифт субтитрів. Другий прохід: ffmpeg 8
# відмовив «-vf crop=…» у пробі - чи працюють ті -vf, що їх викликає рушій (кадри для video_frames, рілс). Третій:
# причина - не ffmpeg 8, а stdin: скрипт іде в sh через stdin, і ffmpeg без -nostdin з'їдав його байти.
# Далі: стан Telegram-бота беті до і після деплою 60ae725 (бета бере свого спільного бота) - лише читання:
# id ботів (без токенів), куди веде вебхук (хост і вид шляху), рядки кабінетів, журнал tgbot.

on:
  push:
    branches: [beta-check]
  workflow_dispatch:
    inputs:
      link:
        description: "Разове посилання для заливки (https://…/mcp/upload/…)"
        required: false
        default: ""

jobs:
  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Beta Telegram bot - who is linked, channels (read-only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 5m
          script: |
            B="${{ secrets.APP_DIR }}-beta"
            echo "зараз $(date -u +%d.%m\ %H:%M) UTC · beta HEAD $(git -C "$B" rev-parse --short HEAD)"
            cd "$B/server"
            docker compose ps app --format '{{.Name}} {{.Status}}'
            curl -fsS -o /dev/null -w "health %{http_code}\n" http://127.0.0.1:8081/health || echo "health недоступний"
            JS=$(cat <<'EOF'
            const { q } = await import('/app/dist/db.js');
            const tg = await import('/app/dist/telegram.js');
            const okTok = (t) => /^\d{5,20}:[A-Za-z0-9_-]{30,}$/.test(String(t || ''));
            const mask = (s) => String(s || '').replace(/([A-Za-z0-9._%+-]{1,4})[A-Za-z0-9._%+-]*@([A-Za-z0-9])[A-Za-z0-9.-]*/g, '$1***@$2…');
            const shared = (await q("select value from app_secret where name='TELEGRAM_BOT_TOKEN'"))[0]?.value || '';
            const me = await tg.getMe(shared);
            console.log('спільний на беті: @' + me.username);
            const ws = await q(`select w.id, coalesce(nullif(w.title,''), w.name) t,
                (select u.email from workspace_member m join app_user u on u.id=m.user_id where m.workspace_id=w.id and m.role='owner' limit 1) owner
              from workspace w`);
            const W = new Map(ws.map((w) => [w.id, 'бренд «' + mask(w.t) + '» (власник ' + mask(w.owner) + ', #' + w.id.slice(0, 8) + ')']));
            for (const o of await q("select workspace_id, to_char(created_at at time zone 'UTC','DD.MM HH24:MI') c from tg_owner order by created_at")) {
              console.log('tg_owner: людина Telegram → ' + (W.get(o.workspace_id) || '?') + ', прив\'язано ' + o.c + ' UTC');
            }
            for (const r of await q('select workspace_id, bot_token, channel_chat_id, group_chat_id from telegram_config')) {
              const token = okTok(r.bot_token) ? r.bot_token : shared;
              const bot = token === shared ? '@' + me.username + ' (спільний)' : 'власний бот ' + String(r.bot_token).split(':')[0];
              const botId = Number(token.split(':')[0]);
              const parts = [];
              for (const [kind, chat] of [['канал', r.channel_chat_id], ['група', r.group_chat_id]]) {
                if (!chat) continue;
                const title = await tg.getChat(token, chat).then((c) => c.title || c.username || '?', (e) => 'не бачить (' + String(e.message).slice(0, 50) + ')');
                const st = await tg.getChatMember(token, chat, botId).then((m) => m.status + (m.can_post_messages === false ? ', без права публікувати' : ''), (e) => 'нема (' + String(e.message).slice(0, 50) + ')');
                parts.push(kind + ' «' + title + '»: бот ' + st);
              }
              console.log(W.get(r.workspace_id) + ': ' + bot + ' · ' + (parts.join(' · ') || 'каналу нема'));
            }
            process.exit(0);
            EOF
            )
            docker compose exec -T app node --input-type=module -e "$JS" 2>&1 | tail -20
            echo "--- консоль беті: бот після рестарту ---"
            docker compose logs --since 40m app 2>&1 | grep -iE "tgbot|telegram" | tail -12

  drop:
    if: github.event_name == 'workflow_dispatch' && inputs.link != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload media-drop via one-time link
        env:
          LINK: ${{ inputs.link }}
        run: |
          echo "::add-mask::$LINK"
          case "$LINK" in
            https://*/mcp/upload/*) ;;
            *) echo "не схоже на разове посилання заливки"; exit 1 ;;
          esac
          ls -la media-drop
          curl -fsS "$LINK/sh" -o holos-upload.sh
          sh holos-upload.sh media-drop
