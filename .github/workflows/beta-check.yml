name: beta-check

# Разова діагностика (запуск: push у гілку beta-check). Лише ЧИТАННЯ, нічого не змінює й не перезапускає.
# 29.09: бета після 36125ce (⏰ без дубля мережі) - версія, здоров'я, і що «⏰» покаже в кабінетах Олега.

on:
  push:
    branches: [beta-check]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Beta after best-time refinement (read-only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 5m
          script: |
            B="${{ secrets.APP_DIR }}-beta"
            echo "зараз $(date -u +%d.%m\ %H:%M) UTC · beta HEAD $(git -C "$B" rev-parse --short HEAD)"
            echo "health: $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/health)"
            cd "$B/server" && echo "контейнер: $(docker compose ps app --format '{{.Status}}')"
            echo "маркери: app.js rhBestAuto=$(docker compose exec -T app grep -c rhBestAuto /app/public/app.js) · anBestPanel=$(docker compose exec -T app grep -c anBestPanel /app/public/app.js) · dist besttime=$(docker compose exec -T app ls /app/dist/besttime.js 2>/dev/null | wc -l)"
            JS=$(cat <<'EOF'
            const { q } = await import('/app/dist/db.js');
            const { bestTimesFor, bestTimeAuto } = await import('/app/dist/metrics.js');
            const mask = (s) => String(s || '').replace(/[^\s@]+@[^\s@]+/g, '<пошта>');
            const mine = await q(`select w.id, coalesce(nullif(w.title,''), '(без назви)') as title, m.role
                                    from workspace w join workspace_member m on m.workspace_id=w.id join app_user u on u.id=m.user_id
                                   where lower(u.email)=lower($1) order by w.created_at`, ['o.stepeniev@swipescape.eu']);
            for (const w of mine) {
              const r = await bestTimesFor(w.id);
              console.log(`\n=== #${w.id.slice(0, 8)} «${mask(w.title)}» (${w.role}) · пояс ${r.tz} · ставити в календар: ${(await bestTimeAuto(w.id)) ? 'так' : 'ні'}`);
              if (!r.items.length) console.log('  (жодної мережі зі статистикою постів)');
              for (const i of r.items) console.log(`  [${i.key.replace(/:(.{6}).*$/, ':…$1')}] n=${i.n} ready=${i.ready} show=${i.show} times=${JSON.stringify(i.times)}\n    ${mask(i.text)}`);
            }
            const all = await q(`select id from workspace`);
            let withData = 0, ready = 0, timed = 0;
            for (const w of all) { const r = await bestTimesFor(w.id); if (r.items.length) withData++; if (r.items.some((i) => i.ready)) ready++; if (r.items.some((i) => i.times.length)) timed++; }
            console.log(`\nусього кабінетів на беті: ${all.length} · зі статистикою постів: ${withData} · з порівнянням вікон: ${ready} · з конкретним часом: ${timed}`);
            process.exit(0);
            EOF
            )
            docker compose exec -T app node --input-type=module -e "$JS" 2>&1 | tail -60
            echo "--- журнал беті після рестарту (помилки й попередження) ---"
            docker compose logs --since 15m app 2>&1 | grep -iE "error|warn|exception" | grep -v "DeprecationWarning" | tail -15
