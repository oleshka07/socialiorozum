name: beta-check

# Разова діагностика (запуск: push у гілку beta-check). Лише ЧИТАННЯ, нічого не змінює й не перезапускає.
# 27.09: новий лендинг і вхід у бренді Holos на беті - перевіряємо ззовні (з самого сервера, через nginx):
# сторінки за PIN беті (PIN задокументований у CLAUDE.md), robots.txt без PIN, кеш-заголовки статики,
# статуси мереж на лендингу, стара адреса беті, журнал після рестарту.

on:
  push:
    branches: [beta-check]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Landing on beta (read-only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 4m
          script: |
            mask() { sed -E -e 's/([A-Za-z0-9._%+-]{1,3})[A-Za-z0-9._%+-]*@([A-Za-z0-9.-]+)/\1***@\2/g' \
                            -e 's/[0-9a-fA-F]{24,}/<hex>/g' -e 's/[0-9]{6,}:[A-Za-z0-9_-]{30,}/<bot-token>/g' \
                            -e 's/((key|token|secret|password|passwd|pwd)[^=:]{0,20}[=:] *)[^ ,"]+/\1<masked>/Ig'; }
            B=https://beta.holos.rozum.one
            J=$(mktemp)
            echo "=== версії ==="
            echo "beta HEAD $(git -C "${{ secrets.APP_DIR }}-beta" rev-parse --short HEAD) | prod HEAD $(git -C "${{ secrets.APP_DIR }}" rev-parse --short HEAD)"
            docker ps --filter name=socialio --format '{{.Names}}\t{{.Status}}'
            echo "=== без PIN ==="
            echo "robots.txt: $(curl -sS -m 15 $B/robots.txt | tr '\n' '|')"
            echo "головна без PIN (очікуємо сторінку PIN): $(curl -sS -m 15 $B/ | grep -o 'Тестове середовище[^<]*' | head -1)"
            echo "стара адреса robots.txt -> $(curl -sS -m 15 -o /dev/null -w '%{http_code} %{redirect_url}' https://beta.socialio.rozum.one/robots.txt)"
            echo "=== з PIN ==="
            curl -sS -m 15 -c $J -o /dev/null -w 'beta-pin %{http_code}\n' -H 'content-type: application/json' -d '{"pin":"2345"}' $B/beta-pin
            H=$(curl -sS -m 15 -b $J $B/)
            echo "головна: $(curl -sS -m 15 -b $J -o /dev/null -w '%{http_code} %{size_download}B' $B/)"
            echo "title: $(echo "$H" | grep -o '<title>[^<]*' | head -1)"
            echo "canonical: $(echo "$H" | grep -o '<link rel="canonical"[^>]*>' | head -1)"
            echo "og:image: $(echo "$H" | grep -o 'property="og:image" content="[^"]*"' | head -1)"
            echo "невставлені токени: $(echo "$H" | grep -cE '%(BASE|ST:|SC:|NET_NOTE|FAQ_NETS)')"
            echo "статуси мереж на лендингу:"
            echo "$H" | grep -oE 'id="p-[a-z]+"|<span class="st st-[a-z]+">[^<]+' | paste - - | sed 's/<span class="st /  /'
            echo "примітка: $(echo "$H" | grep -o '<p class="netnote">[^<]*' | sed 's/<p class="netnote">//')"
            echo "sitemap: $(curl -sS -m 15 -b $J $B/sitemap.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//' | tr '\n' ' ')"
            echo "/index.html -> $(curl -sS -m 15 -b $J -o /dev/null -w '%{http_code} %{redirect_url}' $B/index.html)"
            for p in /register /login /app; do echo "$p: $(curl -sS -m 15 -b $J $B$p | grep -oE '<title>[^<]*|noindex,nofollow' | tr '\n' ' ')"; done
            echo "=== статика й кеш ==="
            for p in /fonts/inter-cyrillic.woff2 /images/site/holos-source-to-post-800.webp /images/og/holos-og-1200x630.jpg /favicon.ico /favicon.svg /apple-touch-icon.png /site.webmanifest /app.js; do
              echo "$p: $(curl -sS -m 15 -b $J -D - -o /dev/null $B$p | grep -iE '^(HTTP|content-type|cache-control)' | tr -d '\r' | tr '\n' ' ')"
            done
            echo "gzip головної через nginx: $(curl -sS -m 15 -b $J -H 'Accept-Encoding: gzip' -D - -o /dev/null $B/ | grep -i '^content-encoding' | tr -d '\r')"
            echo "=== журнал беті після рестарту ==="
            cd "${{ secrets.APP_DIR }}-beta/server" && docker compose logs --since 15m app 2>&1 | grep -iE '"level":(40|50)|error|unhandled' | cut -c1-220 | mask | tail -15
            rm -f $J
