name: beta-check

# Службова гілка. Лише ЧИТАННЯ сервера (діагностика) або заливка файлів у медіатеку кабінету через його ж
# разове посилання. 29.09: бета після монтажу відео - версія, здоров'я, маркери і ПРОБНИЙ МОНТАЖ ffmpeg у
# контейнері беті (тимчасова тека, нічого не пише ні в базу, ні в медіатеку): чи є в Alpine-ffmpeg усі
# фільтри (ass, zoompan, boxblur, loudnorm, amix, tpad, сегментатор) і шрифт субтитрів. Другий прохід: ffmpeg 8
# відмовив «-vf crop=…» у пробі - чи працюють ті -vf, що їх викликає рушій (кадри для video_frames, рілс). Третій:
# причина - не ffmpeg 8, а stdin: скрипт іде в sh через stdin, і ffmpeg без -nostdin з'їдав його байти.

on:
  push:
    branches: [beta-check]
  workflow_dispatch:
    inputs:
      link:
        description: "Разове посилання для заливки (https://…/mcp/upload/…)"
        required: false
        default: ""

jobs:
  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Beta Telegram bot state (read-only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 5m
          script: |
            B="${{ secrets.APP_DIR }}-beta"
            echo "зараз $(date -u +%d.%m\ %H:%M) UTC · beta HEAD $(git -C "$B" rev-parse --short HEAD)"
            cd "$B/server"
            JS=$(cat <<'EOF'
            const { q } = await import('/app/dist/db.js');
            const tg = await import('/app/dist/telegram.js');
            const idOf = (t) => String(t || '').split(':')[0];
            const okTok = (t) => /^\d{5,20}:[A-Za-z0-9_-]{30,}$/.test(String(t || ''));
            const envTok = String(process.env.TELEGRAM_BOT_TOKEN || '').trim();
            const adm = (await q("select value from app_secret where name='TELEGRAM_BOT_TOKEN'"))[0]?.value || '';
            console.log('TELEGRAM_WEBHOOK_OFF=' + (process.env.TELEGRAM_WEBHOOK_OFF || '-') + ' · бот з .env: id ' + (idOf(envTok) || '-') + ' · з адмінки: ' + (adm ? 'id ' + idOf(adm) : 'не задано'));
            for (const [n, t] of [['.env', envTok], ['адмінка', adm]]) {
              if (!t) continue;
              try {
                const me = await tg.getMe(t);
                const wi = await tg.getWebhookInfo(t);
                console.log(n + ': @' + me.username + ' живий · вебхук → ' + (wi.url ? wi.url.replace(/\/api\/webhooks\/telegram\/.*/, '/api/webhooks/telegram/…') : '—'));
              } catch (e) { console.log(n + ': Telegram не прийняв токен (' + String(e.message).slice(0, 90) + ')'); }
            }
            const rows = await q("select bot_token, (channel_chat_id is not null or group_chat_id is not null) as ch from telegram_config");
            const by = {};
            for (const r of rows) {
              const t = r.bot_token || '';
              const k = !t ? 'без токена' : !okTok(t) ? 'не токен (сміття)' : 'бот ' + idOf(t) + (t === envTok ? ' (токен = .env)' : t === adm ? ' (токен = адмінка)' : ' (інший токен)');
              by[k] = (by[k] || 0) + 1;
            }
            console.log('рядки telegram_config (' + rows.length + '):', JSON.stringify(by));
            const fs = (await q("select value from app_secret where name='TG_FORMER_SHARED'"))[0]?.value || '{}';
            console.log('колишні спільні:', Object.keys(JSON.parse(fs)).join(', ') || '-');
            console.log('tg_owner рядків:', (await q('select count(*)::int n from tg_owner'))[0].n);
            process.exit(0);
            EOF
            )
            docker compose exec -T app node --input-type=module -e "$JS" 2>&1 | tail -12
            echo "--- журнал беті: бот (останні 2 доби) ---"
            docker compose logs --since 48h app 2>&1 | grep -iE "tgbot" | tail -12

  drop:
    if: github.event_name == 'workflow_dispatch' && inputs.link != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload media-drop via one-time link
        env:
          LINK: ${{ inputs.link }}
        run: |
          echo "::add-mask::$LINK"
          case "$LINK" in
            https://*/mcp/upload/*) ;;
            *) echo "не схоже на разове посилання заливки"; exit 1 ;;
          esac
          ls -la media-drop
          curl -fsS "$LINK/sh" -o holos-upload.sh
          sh holos-upload.sh media-drop
