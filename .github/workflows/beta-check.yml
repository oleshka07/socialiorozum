name: beta-check

# Службова гілка. Лише ЧИТАННЯ сервера (діагностика) або заливка файлів у медіатеку кабінету через його ж
# разове посилання. 29.09: бета після монтажу відео - версія, здоров'я, маркери і ПРОБНИЙ МОНТАЖ ffmpeg у
# контейнері беті (тимчасова тека, нічого не пише ні в базу, ні в медіатеку): чи є в Alpine-ffmpeg усі
# фільтри (ass, zoompan, boxblur, loudnorm, amix, tpad, сегментатор) і шрифт субтитрів. Другий прохід: ffmpeg 8
# відмовив «-vf crop=…» у пробі - чи працюють ті -vf, що їх викликає рушій (кадри для video_frames, рілс). Третій:
# причина - не ffmpeg 8, а stdin: скрипт іде в sh через stdin, і ffmpeg без -nostdin з'їдав його байти.
# Далі: стан Telegram-бота беті до і після деплою 60ae725 (бета бере свого спільного бота) - лише читання:
# id ботів (без токенів), куди веде вебхук (хост і вид шляху), рядки кабінетів, журнал tgbot.
# 30.09: під сповіщення про збої - які warn/error реально бувають за 30 днів (прод і бета), чи є куди слати
# (ADMIN_EMAILS, Resend, Telegram адміна), баланси провайдерів (OpenRouter, ElevenLabs, Deepgram - лише цифри),
# бекапи, диск і фільтри ffmpeg для переходів і музики. Нічого не пише.
# Далі - після деплою f475477: сповіщення (таблиці, рядки, налаштування), запасний маршрут (чи є ключ OpenAI -
# лише так/ні), привʼязка Telegram до акаунта (tg_owner.user_id - під вибір бренду в боті), пости з бота за 2 дні,
# монтажі й чи має ключ ElevenLabs право Music (навмисно кривий запит - нічого не генерує).
# Далі - після 9bee32a (бренд у боті): версія, здоров'я, код у контейнері, команди бота (getMyCommands), привʼязки,
# сповіщення й warn/error журналу за 20 хв.
# Далі - ПРОД після промоушну 455af3c (усе з беті): версія, health, сторінки, стара адреса, журнал старту, ffmpeg і шрифт,
# нові таблиці, бот (команди, вебхук), привʼязки, сповіщення, кількість даних і warn/error за 25 хв.
# Далі - бета: імʼя файлу змонтованого рілса про бетон (#91d1179b) і чи віддається він публічно - щоб скопіювати
# його у Vary Servis через upload_media конектора (рішення Олега в картці holos-bot-brand).
# Далі - бета після монтажу v3: версія, здоров'я, код у контейнері, колонка обкладинки, фільтри ffmpeg і проба
# libass у тимчасовій теці контейнера (гачок-плашка, субтитри на плашці, шторка) - у базу й медіатеку не пише.
# Далі - під примітки Олега в чек-листі 30.09: чи падає читання коментарів Threads (журнал), яка головна модель у
# кабінетах (OpenRouter чи OpenAI), Vary Servis (пояс, бриф, канали Telegram), нові акаунти для рецензента Meta,
# канали Telegram у брендах, чи є підключення YouTube/TikTok і чи задані їхні ключі (лише так/ні), тест сповіщень.

on:
  push:
    branches: [beta-check]
  workflow_dispatch:
    inputs:
      link:
        description: "Разове посилання для заливки (https://…/mcp/upload/…)"
        required: false
        default: ""

jobs:
  beta:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: beta - read-only facts for Oleg's checklist notes
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 3m
          script: |
            echo "зараз $(date -u +%d.%m\ %H:%M) UTC"
            cd "${{ secrets.APP_DIR }}-beta/server"
            echo "HEAD $(git -C .. rev-parse --short HEAD)"
            curl -s -o /dev/null -w "health %{http_code}\n" http://127.0.0.1:8081/health
            docker compose exec -T app sh -c 'for v in TIKTOK_CLIENT_KEY TIKTOK_CLIENT_SECRET GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET THREADS_APP_ID; do eval "x=\${$v}"; if [ -n "$x" ]; then echo "$v: задано"; else echo "$v: нема"; fi; done'
            JS2=$(cat <<'EOF'
            const { q } = await import('/app/dist/db.js');
            const mask = (s) => String(s || '').replace(/([^@\s]{2})[^@\s]*@/g, '$1***@');
            const t = (d) => d ? new Date(d).toISOString().slice(0, 16).replace('T', ' ') : '-';
            const rows = async (title, sql) => { try { const r = await q(sql); console.log('--- ' + title + ' (' + r.length + ')'); for (const x of r) console.log('  ' + Object.entries(x).map(([k, v]) => k + '=' + (v instanceof Date ? t(v) : mask(typeof v === 'object' && v ? JSON.stringify(v) : v))).join(' | ')); } catch (e) { console.log('--- ' + title + ': ПОМИЛКА ' + e.message); } };
            await rows('журнал: Threads/коментарі за 3 доби', "select created_at, level, scope, left(message, 200) as m from app_log where created_at > now() - interval '3 days' and (message ilike '%replies%' or message ilike '%threads_read%' or scope in ('inbox','comments') or message ilike '%коментар%') order by created_at desc limit 14");
            await rows('головна модель кабінетів', "select coalesce(w.title, w.name) as brand, s.content as model, s.updated_at from settings_block s join workspace w on w.id = s.workspace_id where s.key = 'main_model' order by s.updated_at desc nulls last");
            await rows('виклики AI за добу за моделлю', "select left(model, 48) as model, count(*)::int as n, round(sum(cost)::numeric, 4) as usd, max(created_at) as last from llm_usage where created_at > now() - interval '24 hours' group by 1 order by n desc limit 12");
            await rows('запасний маршрут за добу (журнал)', "select created_at, left(message, 160) as m from app_log where created_at > now() - interval '24 hours' and (message ilike '%запасн%' or message ilike '%openrouter%') order by created_at desc limit 6");
            await rows('нові акаунти за 3 доби', "select u.created_at, u.email, u.email_verified as verified, (select count(*)::int from workspace_member m where m.user_id = u.id) as brands, (select count(*)::int from meta_config mc where mc.workspace_id = u.workspace_id) as meta, (select mc.granted from meta_config mc where mc.workspace_id = u.workspace_id limit 1) as granted from app_user u where u.created_at > now() - interval '3 days' order by u.created_at desc limit 8");
            await rows('Telegram у брендах: основні', "select coalesce(w.title, w.name) as brand, (tc.channel_chat_id is not null) as channel, tc.channel_username as chan, left(coalesce(tc.channel_title, ''), 40) as ch_title, (tc.group_chat_id is not null) as grp, (select count(*)::int from telegram_chat c where c.workspace_id = w.id) as extra from telegram_config tc join workspace w on w.id = tc.workspace_id order by tc.updated_at desc nulls last limit 10");
            await rows('Telegram: додаткові канали', "select coalesce(w.title, w.name) as brand, left(coalesce(c.title, c.username, ''), 40) as title, c.username, c.added_at from telegram_chat c join workspace w on w.id = c.workspace_id order by c.added_at desc limit 10");
            await rows('YouTube/TikTok підключення', "select 'youtube' as net, count(*)::int as n, max(created_at) as last from youtube_config union all select 'tiktok', count(*)::int, max(created_at) from tiktok_config union all select 'yt_pub', count(*)::int, max(created_at) from youtube_publish union all select 'tt_pub', count(*)::int, max(created_at) from tiktok_publish");
            await rows('ключі з адмінки (лише назви)', "select name, updated_at from app_secret order by name");
            await rows('сповіщення: тест і останні', "select first_at, last_at, kind, severity, left(title, 70) as title, notified_at, resolved_at from ops_alert order by last_at desc limit 6");
            await rows('відповіді з вікна коментарів за 2 доби', "select network, action, count(*)::int as n, max(created_at) as last from comment_reply where created_at > now() - interval '2 days' group by 1, 2 order by 1, 2");

            await rows('Vary Servis: пояс, бриф, канали', "select coalesce(w.title, w.name) as brand, (select content from settings_block s where s.workspace_id = w.id and s.key = 'timezone') as tz, (select length(content) from settings_block s where s.workspace_id = w.id and s.key = 'strategy_brief') as brief_len, (select left(content, 90) from settings_block s where s.workspace_id = w.id and s.key = 'strategy_brief') as brief_start, (select updated_at from settings_block s where s.workspace_id = w.id and s.key = 'strategy_brief') as brief_at, (select tc.channel_chat_id is not null from telegram_config tc where tc.workspace_id = w.id) as tg_channel, (select tc.group_chat_id is not null from telegram_config tc where tc.workspace_id = w.id) as tg_group, (select count(*)::int from telegram_chat c where c.workspace_id = w.id) as tg_extra from workspace w where coalesce(w.title, w.name) ilike '%vary%'");

            process.exit(0);
            EOF
            )
            docker compose exec -T app node --input-type=module -e "$JS2" 2>&1 | tail -90

  prod:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: prod - read-only facts for Oleg's checklist notes
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 3m
          script: |
            echo "зараз $(date -u +%d.%m\ %H:%M) UTC"
            cd "${{ secrets.APP_DIR }}/server"
            echo "HEAD $(git -C .. rev-parse --short HEAD)"
            curl -s -o /dev/null -w "health %{http_code}\n" http://127.0.0.1:8080/health
            docker compose exec -T app sh -c 'for v in TIKTOK_CLIENT_KEY TIKTOK_CLIENT_SECRET GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET THREADS_APP_ID; do eval "x=\${$v}"; if [ -n "$x" ]; then echo "$v: задано"; else echo "$v: нема"; fi; done'
            JS2=$(cat <<'EOF'
            const { q } = await import('/app/dist/db.js');
            const mask = (s) => String(s || '').replace(/([^@\s]{2})[^@\s]*@/g, '$1***@');
            const t = (d) => d ? new Date(d).toISOString().slice(0, 16).replace('T', ' ') : '-';
            const rows = async (title, sql) => { try { const r = await q(sql); console.log('--- ' + title + ' (' + r.length + ')'); for (const x of r) console.log('  ' + Object.entries(x).map(([k, v]) => k + '=' + (v instanceof Date ? t(v) : mask(typeof v === 'object' && v ? JSON.stringify(v) : v))).join(' | ')); } catch (e) { console.log('--- ' + title + ': ПОМИЛКА ' + e.message); } };
            await rows('журнал: Threads/коментарі за 3 доби', "select created_at, level, scope, left(message, 200) as m from app_log where created_at > now() - interval '3 days' and (message ilike '%replies%' or message ilike '%threads_read%' or scope in ('inbox','comments') or message ilike '%коментар%') order by created_at desc limit 14");
            await rows('головна модель кабінетів', "select coalesce(w.title, w.name) as brand, s.content as model, s.updated_at from settings_block s join workspace w on w.id = s.workspace_id where s.key = 'main_model' order by s.updated_at desc nulls last");
            await rows('виклики AI за добу за моделлю', "select left(model, 48) as model, count(*)::int as n, round(sum(cost)::numeric, 4) as usd, max(created_at) as last from llm_usage where created_at > now() - interval '24 hours' group by 1 order by n desc limit 12");
            await rows('запасний маршрут за добу (журнал)', "select created_at, left(message, 160) as m from app_log where created_at > now() - interval '24 hours' and (message ilike '%запасн%' or message ilike '%openrouter%') order by created_at desc limit 6");
            await rows('нові акаунти за 3 доби', "select u.created_at, u.email, u.email_verified as verified, (select count(*)::int from workspace_member m where m.user_id = u.id) as brands, (select count(*)::int from meta_config mc where mc.workspace_id = u.workspace_id) as meta, (select mc.granted from meta_config mc where mc.workspace_id = u.workspace_id limit 1) as granted from app_user u where u.created_at > now() - interval '3 days' order by u.created_at desc limit 8");
            await rows('Telegram у брендах: основні', "select coalesce(w.title, w.name) as brand, (tc.channel_chat_id is not null) as channel, tc.channel_username as chan, left(coalesce(tc.channel_title, ''), 40) as ch_title, (tc.group_chat_id is not null) as grp, (select count(*)::int from telegram_chat c where c.workspace_id = w.id) as extra from telegram_config tc join workspace w on w.id = tc.workspace_id order by tc.updated_at desc nulls last limit 10");
            await rows('Telegram: додаткові канали', "select coalesce(w.title, w.name) as brand, left(coalesce(c.title, c.username, ''), 40) as title, c.username, c.added_at from telegram_chat c join workspace w on w.id = c.workspace_id order by c.added_at desc limit 10");
            await rows('YouTube/TikTok підключення', "select 'youtube' as net, count(*)::int as n, max(created_at) as last from youtube_config union all select 'tiktok', count(*)::int, max(created_at) from tiktok_config union all select 'yt_pub', count(*)::int, max(created_at) from youtube_publish union all select 'tt_pub', count(*)::int, max(created_at) from tiktok_publish");
            await rows('ключі з адмінки (лише назви)', "select name, updated_at from app_secret order by name");
            await rows('сповіщення: тест і останні', "select first_at, last_at, kind, severity, left(title, 70) as title, notified_at, resolved_at from ops_alert order by last_at desc limit 6");
            await rows('відповіді з вікна коментарів за 2 доби', "select network, action, count(*)::int as n, max(created_at) as last from comment_reply where created_at > now() - interval '2 days' group by 1, 2 order by 1, 2");

            process.exit(0);
            EOF
            )
            docker compose exec -T app node --input-type=module -e "$JS2" 2>&1 | tail -90

  drop:
    if: github.event_name == 'workflow_dispatch' && inputs.link != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload media-drop via one-time link
        env:
          LINK: ${{ inputs.link }}
        run: |
          echo "::add-mask::$LINK"
          case "$LINK" in
            https://*/mcp/upload/*) ;;
            *) echo "не схоже на разове посилання заливки"; exit 1 ;;
          esac
          ls -la media-drop
          curl -fsS "$LINK/sh" -o holos-upload.sh
          sh holos-upload.sh media-drop
