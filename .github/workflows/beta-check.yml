name: beta-check

# Разова діагностика (запуск: push у гілку beta-check). Лише ЧИТАННЯ, нічого не змінює й не перезапускає.
# 28.09: Олег надіслав скрін нового пояснення «Meta не прийняла адресу цього сайту (beta.holos.rozum.one)».
# Питання: де саме були спроби підключення за останні 12 год - лише на беті чи й на проді, і чи дійшло
# щось до колбека (журнал app_log + nginx).

on:
  push:
    branches: [beta-check]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Connect attempts (read-only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 3m
          script: |
            mask() { sed -E -e 's/([A-Za-z0-9._%+-]{1,3})[A-Za-z0-9._%+-]*@([A-Za-z0-9.-]+)/\1***@\2/g' \
                            -e 's/[0-9a-fA-F]{24,}/<hex>/g' -e 's/[0-9]{6,}:[A-Za-z0-9_-]{30,}/<bot-token>/g' \
                            -e 's/EAA[A-Za-z0-9]{20,}/<meta-token>/g' -e 's/TH[A-Za-z0-9]{40,}/<th-token>/g' \
                            -e 's/((^|[?&])(code|state|access_token|client_secret)=)[^&" ]+/\1<x>/g'; }
            echo "prod HEAD $(git -C "${{ secrets.APP_DIR }}" rev-parse --short HEAD) | beta HEAD $(git -C "${{ secrets.APP_DIR }}-beta" rev-parse --short HEAD)"
            for d in "${{ secrets.APP_DIR }}" "${{ secrets.APP_DIR }}-beta"; do
            echo; echo "=================== журнал підключень: $d (12 год, час Праги) ==================="
            cd "$d/server" || continue
            docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -P pager=off -v ON_ERROR_STOP=0' <<'SQL' 2>&1 | mask
            set session characteristics as transaction read only;
            select to_char(l.created_at at time zone 'Europe/Prague','DD.MM HH24:MI:SS') as t, l.level, l.scope,
                   left(regexp_replace(l.message,'\s+',' ','g'),150) as msg, l.meta->>'code' as code, u.email
              from app_log l left join app_user u on u.id = l.user_id
             where l.created_at > now() - interval '12 hours'
               and l.scope in ('meta','threads','linkedin','google','gdrive','youtube','oauth')
             order by l.created_at desc limit 40;
            SQL
            done
            echo; echo "=================== nginx: підключення й повернення (12 год) ==================="
            for f in /var/log/nginx/access.log /var/log/nginx/access.log.1; do
              [ -r "$f" ] || continue
              grep -hE '/api/(integrations/(meta|threads|linkedin|gdrive|youtube)/(connect|callback)|auth/google)' "$f" 2>/dev/null \
                | grep -E "$(date -u +%d/%b/%Y)|$(date -u -d '12 hours ago' +%d/%b/%Y)" \
                | sed -E 's/^([0-9]+\.[0-9]+)\.[0-9]+\.[0-9]+/\1.x.x/' | mask | cut -c1-240 | tail -20
            done
