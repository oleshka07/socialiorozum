name: beta-check

# Службова гілка. Лише ЧИТАННЯ сервера (діагностика) або заливка файлів у медіатеку кабінету через його ж
# разове посилання. 29.09: бета після монтажу відео - версія, здоров'я, маркери і ПРОБНИЙ МОНТАЖ ffmpeg у
# контейнері беті (тимчасова тека, нічого не пише ні в базу, ні в медіатеку): чи є в Alpine-ffmpeg усі
# фільтри (ass, zoompan, boxblur, loudnorm, amix, tpad, сегментатор) і шрифт субтитрів. Другий прохід: ffmpeg 8
# відмовив «-vf crop=…» у пробі - чи працюють ті -vf, що їх викликає рушій (кадри для video_frames, рілс). Третій:
# причина - не ffmpeg 8, а stdin: скрипт іде в sh через stdin, і ffmpeg без -nostdin з'їдав його байти.
# Далі: стан Telegram-бота беті до і після деплою 60ae725 (бета бере свого спільного бота) - лише читання:
# id ботів (без токенів), куди веде вебхук (хост і вид шляху), рядки кабінетів, журнал tgbot.

on:
  push:
    branches: [beta-check]
  workflow_dispatch:
    inputs:
      link:
        description: "Разове посилання для заливки (https://…/mcp/upload/…)"
        required: false
        default: ""

jobs:
  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Montage freeze - job, sources, segments (read-only, temp dir)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 15m
          script: |
            B="${{ secrets.APP_DIR }}-beta"
            echo "зараз $(date -u +%d.%m\ %H:%M) UTC · beta HEAD $(git -C "$B" rev-parse --short HEAD)"
            cd "$B/server"
            docker compose exec -T app sh -c 'ffmpeg -version | head -1'
            JS=$(cat <<'EOF'
            const { q, one } = await import('/app/dist/db.js');
            const { MEDIA_DIR, probeVideo } = await import('/app/dist/media.js');
            const P = await import('/app/dist/montage-plan.js');
            const cp = await import('node:child_process');
            const fs = await import('node:fs');
            const path = await import('node:path');
            const sh = (cmd, args, t = 240000, cwd) => { try { return cp.execFileSync(cmd, args, { timeout: t, cwd, stdio: ['ignore', 'pipe', 'pipe'] }).toString(); } catch (e) { return 'ERR ' + String(e.stderr || e.message).slice(-600); } };
            const w8 = (x) => String(x || '').slice(0, 8);
            const logs = await q("select level, message, meta->>'ws' ws, to_char(created_at at time zone 'UTC','DD.MM HH24:MI:SS') t from app_log where (scope='montage' or (scope='job' and message like 'montage%')) and created_at > now() - interval '48 hours' order by created_at desc limit 10");
            for (const l of logs) console.log('log', l.t, l.level, w8(l.ws), String(l.message).slice(0, 220));
            const jobs = await q("select id, workspace_id, status, error, result, to_char(created_at at time zone 'UTC','DD.MM HH24:MI:SS') c, to_char(updated_at at time zone 'UTC','HH24:MI:SS') u, created_at, updated_at from job where kind='montage' order by created_at desc limit 6");
            for (const j of jobs) { const r = j.result || {}; console.log('job', w8(j.id), 'ws', w8(j.workspace_id), j.c, '->', j.u, j.status, j.error ? String(j.error).slice(0, 160) : '', '| voice', r.voice, 'clips', r.clips, 'dur', r.duration, 'sub', r.subtitles, 'prov', r.provider, 'warn', JSON.stringify(r.warnings || []), 'videos', JSON.stringify((r.videos || []).map((v) => w8(v.id) + ':' + v.duration)), 'post', w8(r.postId)); }
            const J = jobs.find((j) => j.status === 'done') || jobs[0];
            if (!J) { console.log('монтажів нема'); process.exit(0); }
            const ws = J.workspace_id;
            const media = await q("select id, kind, source, original_name, filename, size, duration, width, height, mime, to_char(created_at at time zone 'UTC','DD.MM HH24:MI:SS') t, created_at from media_asset where workspace_id=$1 and created_at > $2::timestamptz - interval '6 hours' and created_at < $3::timestamptz + interval '10 minutes' order by created_at", [ws, J.created_at, J.updated_at]);
            for (const m of media) console.log('media', w8(m.id), m.t, m.kind, m.source, m.mime, m.size, 'dur', m.duration, m.width + 'x' + m.height, String(m.original_name || '').slice(0, 40));
            const st = await one("select content from settings_block where workspace_id=$1 and key='montage_state'", [ws]);
            console.log('montage_state', st ? String(st.content).slice(0, 300) : 'нема (сесію закрито)');
            const probe = (f) => { const out = sh('ffprobe', ['-v', 'error', '-print_format', 'json', '-show_format', '-show_streams', path.join(MEDIA_DIR, f)], 30000); try { return JSON.parse(out); } catch { return { err: out.slice(0, 300) }; } };
            const pk = (f, sel) => { const o = sh('ffprobe', ['-v', 'error', '-select_streams', sel, '-show_entries', 'packet=pts_time,dts_time,duration_time,flags', '-of', 'csv=p=0', f], 60000).trim().split('\n').filter(Boolean); return { n: o.length, first: o.slice(0, 2).join(' / '), last: o.slice(-2).join(' / ') }; };
            for (const m of media.filter((x) => x.kind !== 'image')) {
              const j = probe(m.filename);
              if (j.err) { console.log('probe', w8(m.id), j.err); continue; }
              const f = j.format || {};
              console.log('probe', w8(m.id), m.source, 'fmt', f.format_name, 'dur', f.duration, 'start', f.start_time, 'streams', (j.streams || []).length, 'brand', f.tags?.major_brand || '', 'enc', String(f.tags?.encoder || '').slice(0, 30));
              for (const s of j.streams || []) console.log('   s' + s.index, s.codec_type, s.codec_name, s.codec_tag_string, s.profile || '', s.pix_fmt || '', s.width ? s.width + 'x' + s.height : '', 'r', s.r_frame_rate, 'avg', s.avg_frame_rate, 'tb', s.time_base, 'start', s.start_time, 'dur', s.duration, 'frames', s.nb_frames, 'rot', JSON.stringify((s.side_data_list || []).map((x) => x.rotation).filter((x) => x != null)), s.tags?.rotate || '', 'hdlr', String(s.tags?.handler_name || '').slice(0, 24), s.color_transfer || '', s.disposition?.attached_pic ? 'attached_pic' : '');
              if (m.kind === 'video') { const v = pk(path.join(MEDIA_DIR, m.filename), 'v:0'); const a = pk(path.join(MEDIA_DIR, m.filename), 'a:0'); console.log('   packets v', v.n, '[', v.first, '..', v.last, '] a', a.n, '[', a.first, '..', a.last, ']'); }
            }
            // повтор сегментів точно як у montage.ts (тимчасова тека, нічого не пишеться в базу чи медіатеку)
            const cands = media.filter((x) => x.kind === 'video' && x.source !== 'montage' && x.created_at < J.created_at);
            const R = J.result || {};
            if (cands.length < 2) { console.log('кандидатів-кліпів', cands.length, '- повтор пропущено'); process.exit(0); }
            const srcs = [];
            for (const m of cands.slice(-4)) { const v = await probeVideo(path.join(MEDIA_DIR, m.filename)); srcs.push({ m, v }); }
            const total = (R.voice === 'audio' || R.voice === 'tts') ? Number(R.duration) : null;
            const durs = P.allocate(srcs.map((s) => ({ avail: Math.max(0.3, s.v.duration), want: null, still: false })), total);
            console.log('повтор: кліпи', srcs.map((s) => w8(s.m.id) + ' ' + s.v.duration + 's ' + s.v.width + 'x' + s.v.height + ' ' + s.v.vcodec + '/' + s.v.acodec).join(' | '), 'total', total, 'durs', JSON.stringify(durs));
            const dir = '/tmp/mprobe-' + Date.now();
            fs.mkdirSync(dir);
            const W = 1080, H = 1920, FPS = 30;
            const coverChain = 'scale=' + W + ':' + H + ':force_original_aspect_ratio=increase,crop=' + W + ':' + H;
            const padChain = (inL, outL) => inL + 'split=2[bg0][fg0];[bg0]' + coverChain + ',boxblur=luma_radius=40:luma_power=2,eq=brightness=-0.06[bg];[fg0]scale=' + W + ':-2[fg];[bg][fg]overlay=(W-w)/2:(H-h)/2' + outL;
            const segs = [];
            for (let i = 0; i < srcs.length; i++) {
              const s = srcs[i]; const d = durs[i].toFixed(3);
              const fit = P.fitClip(Math.max(0.3, s.v.duration), durs[i], false);
              const portrait = s.v.height > 0 && s.v.width / s.v.height <= 0.8;
              const pre = fit.speed !== 1 ? 'setpts=' + fit.speed + '*PTS,' : '';
              const tail = 'fps=' + FPS + ',format=yuv420p,setsar=1' + (fit.freeze > 0 ? ',tpad=stop_mode=clone:stop_duration=' + fit.freeze.toFixed(3) : '') + '[v]';
              const vg = portrait ? '[0:v]' + pre + coverChain + ',' + tail : (padChain('[0:v]' + pre, ',') + tail).replace(',,', ',');
              const sound = !!s.v.acodec && fit.speed === 1;
              const ag = sound ? ';[0:a]aresample=48000,aformat=channel_layouts=stereo,apad[a]' : '';
              const args = ['-hide_banner', '-nostdin', '-loglevel', 'error', '-y', '-ss', fit.offset.toFixed(3), '-t', fit.take.toFixed(3), '-i', path.join(MEDIA_DIR, s.m.filename)];
              if (!sound) args.push('-f', 'lavfi', '-t', d, '-i', 'anullsrc=r=48000:cl=stereo');
              const out = 'seg' + i + '.mp4';
              const t0 = Date.now();
              const r = sh('nice', ['-n', '10', 'ffmpeg', ...args, '-filter_complex', vg + ag, '-map', '[v]', '-map', sound ? '[a]' : '1:a', '-t', d, '-r', String(FPS), '-c:v', 'libx264', '-preset', 'ultrafast', '-crf', '18', '-pix_fmt', 'yuv420p', '-g', String(FPS), '-c:a', 'aac', '-b:a', '160k', '-ar', '48000', '-ac', '2', '-threads', '2', out], 300000, dir);
              console.log('seg' + i, 'fit', JSON.stringify(fit), 'portrait', portrait, 'sound', sound, (Date.now() - t0) + 'ms', r.startsWith('ERR') ? r : 'ok');
              const j = JSON.parse(sh('ffprobe', ['-v', 'error', '-print_format', 'json', '-show_format', '-show_streams', path.join(dir, out)], 30000) || '{}');
              console.log('   seg' + i, 'fmt dur', j.format?.duration, 'start', j.format?.start_time, (j.streams || []).map((x) => x.codec_type + ' start ' + x.start_time + ' dur ' + x.duration + ' frames ' + x.nb_frames).join(' | '));
              const v = pk(path.join(dir, out), 'v:0');
              console.log('   seg' + i, 'v packets', v.n, '[', v.first, '..', v.last, ']');
              segs.push(out);
            }
            fs.writeFileSync(path.join(dir, 'list.txt'), segs.map((x) => "file '" + x + "'").join('\n') + '\n');
            const cat = sh('ffprobe', ['-v', 'error', '-f', 'concat', '-safe', '0', '-i', 'list.txt', '-select_streams', 'v:0', '-show_entries', 'packet=pts_time', '-of', 'csv=p=0'], 60000, dir).trim().split('\n').map(Number).filter((x) => !isNaN(x)).sort((a, b) => a - b);
            let gaps = []; for (let k = 1; k < cat.length; k++) if (cat[k] - cat[k - 1] > 0.2) gaps.push(cat[k - 1].toFixed(3) + '->' + cat[k].toFixed(3));
            console.log('concat: відео-пакетів', cat.length, 'від', cat[0], 'до', cat[cat.length - 1], 'дірки', JSON.stringify(gaps.slice(0, 5)));
            const tot = durs.reduce((a, b) => a + b, 0).toFixed(3);
            const fin = sh('nice', ['-n', '10', 'ffmpeg', '-hide_banner', '-nostdin', '-loglevel', 'error', '-y', '-f', 'concat', '-safe', '0', '-i', 'list.txt', '-map', '0:v', '-t', tot, '-r', '30', '-c:v', 'libx264', '-preset', 'ultrafast', '-threads', '2', 'fin.mp4'], 300000, dir);
            console.log('фінал (без субтитрів):', fin.startsWith('ERR') ? fin : 'ok');
            const fz = sh('ffmpeg', ['-hide_banner', '-nostdin', '-i', 'fin.mp4', '-vf', 'freezedetect=n=0.003:d=1.5', '-an', '-f', 'null', '-'], 120000, dir);
            console.log('freeze:', (String(fz).match(/freeze_(start|end): [0-9.]+/g) || []).join(' ') || 'нема');
            fs.rmSync(dir, { recursive: true, force: true });
            process.exit(0);
            EOF
            )
            docker compose exec -T app node --input-type=module -e "$JS" 2>&1 | tail -90

  drop:
    if: github.event_name == 'workflow_dispatch' && inputs.link != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload media-drop via one-time link
        env:
          LINK: ${{ inputs.link }}
        run: |
          echo "::add-mask::$LINK"
          case "$LINK" in
            https://*/mcp/upload/*) ;;
            *) echo "не схоже на разове посилання заливки"; exit 1 ;;
          esac
          ls -la media-drop
          curl -fsS "$LINK/sh" -o holos-upload.sh
          sh holos-upload.sh media-drop
