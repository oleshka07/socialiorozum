name: beta-check

# Службова гілка. Лише ЧИТАННЯ сервера (діагностика) або заливка файлів у медіатеку кабінету через його ж
# разове посилання. 29.09: бета після монтажу відео - версія, здоров'я, маркери і ПРОБНИЙ МОНТАЖ ffmpeg у
# контейнері беті (тимчасова тека, нічого не пише ні в базу, ні в медіатеку): чи є в Alpine-ffmpeg усі
# фільтри (ass, zoompan, boxblur, loudnorm, amix, tpad, сегментатор) і шрифт субтитрів. Другий прохід: ffmpeg 8
# відмовив «-vf crop=…» у пробі - чи працюють ті -vf, що їх викликає рушій (кадри для video_frames, рілс). Третій:
# причина - не ffmpeg 8, а stdin: скрипт іде в sh через stdin, і ffmpeg без -nostdin з'їдав його байти.
# Далі: стан Telegram-бота беті до і після деплою 60ae725 (бета бере свого спільного бота) - лише читання:
# id ботів (без токенів), куди веде вебхук (хост і вид шляху), рядки кабінетів, журнал tgbot.

on:
  push:
    branches: [beta-check]
  workflow_dispatch:
    inputs:
      link:
        description: "Разове посилання для заливки (https://…/mcp/upload/…)"
        required: false
        default: ""

jobs:
  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Beta bot log since 29.09 15:38 UTC + montage jobs after a2cf2bd (read-only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 5m
          script: |
            B="${{ secrets.APP_DIR }}-beta"
            echo "зараз $(date -u +%d.%m\ %H:%M) UTC · beta HEAD $(git -C "$B" rev-parse --short HEAD)"
            cd "$B/server"
            docker compose ps app --format '{{.Name}} {{.Status}}'
            curl -fsS -o /dev/null -w "health %{http_code}\n" http://127.0.0.1:8081/health || echo "health недоступний"
            JS=$(cat <<'EOF'
            const { q } = await import('/app/dist/db.js');
            const tg = await import('/app/dist/telegram.js');
            const w8 = (x) => String(x || '').slice(0, 8);
            const mask = (s) => String(s || '').replace(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g, '***@***').replace(/\d{6,}:[A-Za-z0-9_-]{20,}/g, '<token>');
            const since = '2026-09-29 15:38:00+00';
            const lv = await q("select level, scope, count(*)::int n from app_log where created_at > $1 group by level, scope order by level, n desc", [since]);
            console.log('журнал з 29.09 15:38 UTC:', lv.map((r) => r.level + '/' + r.scope + '=' + r.n).join(' · ') || 'порожньо');
            const bad = await q("select level, scope, left(message, 200) m, count(*)::int n, to_char(min(created_at) at time zone 'UTC','DD.MM HH24:MI') a, to_char(max(created_at) at time zone 'UTC','DD.MM HH24:MI') b from app_log where created_at > $1 and level in ('error','warn') group by level, scope, left(message, 200) order by max(created_at) desc limit 25", [since]);
            for (const r of bad) console.log('  ' + r.level + ' ' + r.scope + ' ×' + r.n + ' [' + r.a + (r.a !== r.b ? '..' + r.b : '') + '] ' + mask(r.m));
            if (!bad.length) console.log('  warn/error: нема');
            const a = (await q("select value from app_secret where name='TELEGRAM_BOT_TOKEN'"))[0];
            if (a?.value) {
              try { const wi = await tg.getWebhookInfo(a.value); const u = String(wi.url || ''); console.log('спільний бот: вебхук → ' + (u ? new URL(u).host : '—') + ' · у черзі ' + (wi.pending_update_count ?? 0) + (wi.last_error_date ? ' · остання помилка ' + new Date(wi.last_error_date * 1000).toISOString().slice(5, 16) + ' ' + String(wi.last_error_message || '').slice(0, 120) : ' · помилок доставки нема')); }
              catch (e) { console.log('спільний бот: Telegram не відповів (' + String(e.message).slice(0, 100) + ')'); }
            }
            const upd = await q("select count(*)::int n, to_char(max(updated_at) at time zone 'UTC','DD.MM HH24:MI') t from tg_message where updated_at > $1", [since]).catch(() => [{ n: '?', t: '?' }]);
            console.log('повідомлень бота (tg_message) з 15:38:', upd[0]?.n, 'останнє', upd[0]?.t || '-');
            const jobs = await q("select id, workspace_id, status, error, result, to_char(created_at at time zone 'UTC','DD.MM HH24:MI') c from job where kind='montage' and created_at > '2026-09-29 16:30:00+00' order by created_at");
            for (const j of jobs) { const r = j.result || {}; console.log('монтаж ' + j.c + ' ws ' + w8(j.workspace_id) + ' ' + j.status + (j.error ? ' ' + mask(String(j.error).slice(0, 150)) : '') + ' | voice ' + r.voice + ' кліпів ' + r.clips + ' ' + r.duration + ' с ' + JSON.stringify(r.warnings || [])); }
            if (!jobs.length) console.log('монтажів після деплою a2cf2bd: нема');
            const st = await q("select workspace_id, content from settings_block where key='montage_state'");
            for (const s of st) { try { const m = JSON.parse(s.content); console.log('відкрита сесія монтажу ws ' + w8(s.workspace_id) + ': кліпів ' + (m.clips || []).length + (m.voice ? ', голос ' + m.voice.dur + ' с' : '') + ', востаннє ' + new Date(m.at).toISOString().slice(5, 16)); } catch { /* */ } }
            process.exit(0);
            EOF
            )
            docker compose exec -T app node --input-type=module -e "$JS" 2>&1 | tail -45
            echo "--- консоль беті (tgbot/telegram), останні 12 год ---"
            docker compose logs --since 12h app 2>&1 | grep -iE "\[(warn|error)\] (tgbot|telegram)" | tail -12 || true

  drop:
    if: github.event_name == 'workflow_dispatch' && inputs.link != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload media-drop via one-time link
        env:
          LINK: ${{ inputs.link }}
        run: |
          echo "::add-mask::$LINK"
          case "$LINK" in
            https://*/mcp/upload/*) ;;
            *) echo "не схоже на разове посилання заливки"; exit 1 ;;
          esac
          ls -la media-drop
          curl -fsS "$LINK/sh" -o holos-upload.sh
          sh holos-upload.sh media-drop
