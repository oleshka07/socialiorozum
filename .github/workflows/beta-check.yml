name: beta-check

# Службова гілка. Лише ЧИТАННЯ сервера (діагностика) або заливка файлів у медіатеку кабінету через його ж
# разове посилання. 29.09: бета після монтажу відео - версія, здоров'я, маркери і ПРОБНИЙ МОНТАЖ ffmpeg у
# контейнері беті (тимчасова тека, нічого не пише ні в базу, ні в медіатеку): чи є в Alpine-ffmpeg усі
# фільтри (ass, zoompan, boxblur, loudnorm, amix, tpad, сегментатор) і шрифт субтитрів. Другий прохід: ffmpeg 8
# відмовив «-vf crop=…» у пробі - чи працюють ті -vf, що їх викликає рушій (кадри для video_frames, рілс). Третій:
# причина - не ffmpeg 8, а stdin: скрипт іде в sh через stdin, і ffmpeg без -nostdin з'їдав його байти.
# Далі: стан Telegram-бота беті до і після деплою 60ae725 (бета бере свого спільного бота) - лише читання:
# id ботів (без токенів), куди веде вебхук (хост і вид шляху), рядки кабінетів, журнал tgbot.
# 30.09: під сповіщення про збої - які warn/error реально бувають за 30 днів (прод і бета), чи є куди слати
# (ADMIN_EMAILS, Resend, Telegram адміна), баланси провайдерів (OpenRouter, ElevenLabs, Deepgram - лише цифри),
# бекапи, диск і фільтри ffmpeg для переходів і музики. Нічого не пише.
# Далі - після деплою f475477: сповіщення (таблиці, рядки, налаштування), запасний маршрут (чи є ключ OpenAI -
# лише так/ні), привʼязка Telegram до акаунта (tg_owner.user_id - під вибір бренду в боті), пости з бота за 2 дні,
# монтажі й чи має ключ ElevenLabs право Music (навмисно кривий запит - нічого не генерує).
# Далі - після 9bee32a (бренд у боті): версія, здоров'я, код у контейнері, команди бота (getMyCommands), привʼязки,
# сповіщення й warn/error журналу за 20 хв.
# Далі - ПРОД після промоушну 455af3c (усе з беті): версія, health, сторінки, стара адреса, журнал старту, ffmpeg і шрифт,
# нові таблиці, бот (команди, вебхук), привʼязки, сповіщення, кількість даних і warn/error за 25 хв.
# Далі - бета: імʼя файлу змонтованого рілса про бетон (#91d1179b) і чи віддається він публічно - щоб скопіювати
# його у Vary Servis через upload_media конектора (рішення Олега в картці holos-bot-brand).
# Далі - бета після монтажу v3: версія, здоров'я, код у контейнері, колонка обкладинки, фільтри ffmpeg і проба
# libass у тимчасовій теці контейнера (гачок-плашка, субтитри на плашці, шторка) - у базу й медіатеку не пише.
# Далі - під примітки Олега в чек-листі 30.09: чи падає читання коментарів Threads (журнал), яка головна модель у
# кабінетах (OpenRouter чи OpenAI), Vary Servis (пояс, бриф, канали Telegram), нові акаунти для рецензента Meta,
# канали Telegram у брендах, чи є підключення YouTube/TikTok і чи задані їхні ключі (лише так/ні), тест сповіщень.
# Далі - після хотфіксу 761d958 (прод: політика й умови) і 3150429 (бета): сторінки, код у контейнері, тривоги й журнал.

on:
  push:
    branches: [beta-check]
  workflow_dispatch:
    inputs:
      link:
        description: "Разове посилання для заливки (https://…/mcp/upload/…)"
        required: false
        default: ""

jobs:
  prod:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: prod after legal hotfix 761d958 (read-only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 3m
          script: |
            echo "зараз $(date -u +%d.%m\ %H:%M) UTC"
            cd "${{ secrets.APP_DIR }}/server"
            echo "HEAD $(git -C .. rev-parse --short HEAD)"
            curl -s -o /dev/null -w "health %{http_code}\n" http://127.0.0.1:8080/health
            for pth in privacy terms data-deletion; do
              b=$(curl -s -H "Host: holos.rozum.one" -H "X-Forwarded-Proto: https" http://127.0.0.1:8080/$pth)
              echo "/$pth: $(printf %s "$b" | wc -c) байт · Swipe Scape: $(printf %s "$b" | grep -c 'Swipe Scape s.r.o.') · IČO: $(printf %s "$b" | grep -c '22269134') · YouTube API Services: $(printf %s "$b" | grep -c 'YouTube API Services') · youtube.com/t/terms: $(printf %s "$b" | grep -c 'youtube.com/t/terms') · security.google.com: $(printf %s "$b" | grep -c 'security.google.com/settings/security/permissions') · TikTok: $(printf %s "$b" | grep -c 'TikTok') · privacy@: $(printf %s "$b" | grep -c 'privacy@swipescape.eu') · стара пошта: $(printf %s "$b" | grep -c 'o.stepeniev@')"
            done
            curl -s -o /dev/null -w "стара адреса /privacy → %{http_code} %{redirect_url}\n" -H "Host: socialio.rozum.one" -H "X-Forwarded-Proto: https" http://127.0.0.1:8080/privacy

  beta:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: beta after 3150429 (read-only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 3m
          script: |
            echo "зараз $(date -u +%d.%m\ %H:%M) UTC"
            cd "${{ secrets.APP_DIR }}-beta/server"
            echo "HEAD $(git -C .. rev-parse --short HEAD)"
            curl -s -o /dev/null -w "health %{http_code}\n" http://127.0.0.1:8081/health
            docker compose exec -T app sh -c 'echo "threads_read_replies у вході: $(grep -c threads_read_replies dist/server.js)"; echo "«＋ Додати канал чи групу» у боті: $(grep -c "Додати канал чи групу" dist/tgcompose.js)"; echo "нові кабінети - посилання: $(grep -c NEW_WORKSPACE_SETTINGS dist/auth.js)"; echo "проба OpenRouter лише для користувачів: $(grep -c "баланс не стежимо" dist/alerts.js)"'
            JS2=$(cat <<'EOF'
            const { q } = await import('/app/dist/db.js');
            const mask = (s) => String(s ?? '').replace(/([^@\s]{2})[^@\s]*@/g, '$1***@');
            const mm = await q("select distinct content from settings_block where key='main_model'");
            console.log('головні моделі на беті: ' + (mm.map((x) => x.content).join(', ') || '-'));
            const al = await q("select fp, severity, count, last_at, resolved_at from ops_alert where fp like '%OpenRouter%' order by last_at desc limit 3");
            for (const a of al) console.log('тривога ' + a.fp + ' · ' + a.severity + ' ×' + a.count + ' · востаннє ' + new Date(a.last_at).toISOString().slice(0, 16) + ' · ' + (a.resolved_at ? 'закрита ' + new Date(a.resolved_at).toISOString().slice(0, 16) : 'відкрита'));
            const w = await q("select created_at, level, scope, left(message, 170) as m from app_log where created_at > now() - interval '15 minutes' and level in ('warn','error') order by created_at desc limit 8");
            for (const x of w) console.log(new Date(x.created_at).toISOString().slice(11, 19) + ' ' + x.level + ' ' + (x.scope || '-') + ': ' + mask(x.m));
            if (!w.length) console.log('warn/error за 15 хв: нічого');
            process.exit(0);
            EOF
            )
            docker compose exec -T app node --input-type=module -e "$JS2" 2>&1 | tail -20

  drop:
    if: github.event_name == 'workflow_dispatch' && inputs.link != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload media-drop via one-time link
        env:
          LINK: ${{ inputs.link }}
        run: |
          echo "::add-mask::$LINK"
          case "$LINK" in
            https://*/mcp/upload/*) ;;
            *) echo "не схоже на разове посилання заливки"; exit 1 ;;
          esac
          ls -la media-drop
          curl -fsS "$LINK/sh" -o holos-upload.sh
          sh holos-upload.sh media-drop
