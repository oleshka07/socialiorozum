name: beta-check

# Разова діагностика (запуск: push у гілку beta-check). Лише ЧИТАННЯ, нічого не змінює й не перезапускає.
# 28.09 після деплою 7ecd670 (галочки + кілька каналів Telegram): чи лягла міграція, що з ключами
# коментарів і метрик у живих даних, чи віддає застосунок новий кабінет, журнал після рестарту.

on:
  push:
    branches: [beta-check]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Beta after 7ecd670 - checkboxes and Telegram channels (read-only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 4m
          script: |
            mask() { sed -E -e 's/([A-Za-z0-9._%+-]{1,3})[A-Za-z0-9._%+-]*@([A-Za-z0-9.-]+)/\1***@\2/g' \
                            -e 's/EAA[A-Za-z0-9]{20,}/<meta-token>/g' -e 's/TH[A-Za-z0-9]{40,}/<th-token>/g'; }
            echo "beta HEAD $(git -C "${{ secrets.APP_DIR }}-beta" rev-parse --short HEAD) | зараз $(date -u +%H:%M) UTC"
            echo "health: $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/health)"
            cd "${{ secrets.APP_DIR }}-beta/server" && docker compose ps app --format '{{.Status}}'
            echo "кабінет з галочками: $(docker compose exec -T app sh -c 'grep -c "accchk" public/app.js; grep -c "tgChatsBox" public/app.html' | tr '\n' ' ')"
            docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -P pager=off -v ON_ERROR_STOP=0' <<'SQL' 2>&1 | mask
            set session characteristics as transaction read only;
            \echo === індекси й ключі після міграції ===
            select string_agg(indexname, ', ' order by indexname) from pg_indexes
             where indexname in ('uq_thpub_post','uq_metapub_post_channel','uq_thpub_post_acc','uq_metapub_post_ch_acc','uq_post_comment_acc','uq_post_metric_acc','uq_tgpub_post_target');
            select conname from pg_constraint where conname in ('post_comment_post_id_network_key','post_metric_pkey');
            select to_regclass('telegram_chat') telegram_chat, (select count(*) from information_schema.columns where table_name='tg_connect' and column_name='mode') tg_mode;
            \echo === коментарі й метрики: ключ акаунта (порожній - публікація без акаунта) ===
            select 'post_comment' t, network, (account<>'') has_acc, count(*) from post_comment group by 1,2,3
            union all select 'post_metric', network, (account<>''), count(*) from post_metric group by 1,2,3 order by 1,2,3;
            \echo === коментарі/метрики з ключем '', хоча в публікації акаунт відомий (мають бути 0) ===
            select count(*) comments_orphan from post_comment pc
             where pc.account='' and exists (select 1 from threads_publish tp where tp.post_id=pc.post_id and pc.network='threads' and tp.status='sent' and tp.account_id is not null)
               and not exists (select 1 from threads_publish tp where tp.post_id=pc.post_id and pc.network='threads' and tp.status='sent' and tp.account_id is null);
            select count(*) metrics_orphan from post_metric pm
             where pm.account='' and exists (select 1 from meta_publish mp where mp.post_id=pm.post_id and mp.channel=pm.network and mp.status='sent' and mp.account_id is not null)
               and not exists (select 1 from meta_publish mp where mp.post_id=pm.post_id and mp.channel=pm.network and mp.status='sent' and mp.account_id is null);
            \echo === Telegram: рядки без chat_id, підписники по каналах ===
            select count(*) filter (where chat_id is null) no_chat, count(*) total from telegram_publish where status='sent';
            select network, (account<>'') has_acc, count(*) from follower_snapshot where network='telegram' group by 1,2;
            \echo === незавершені резервації (sending) ===
            select 'threads' net, count(*) from threads_publish where status='sending' union all select 'meta', count(*) from meta_publish where status='sending' union all select 'telegram', count(*) from telegram_publish where status='sending';
            \echo === журнал з рестарту (помилки й попередження) ===
            select to_char(created_at at time zone 'Europe/Prague','HH24:MI:SS') t, level, scope, left(regexp_replace(message,'\s+',' ','g'),150) msg
              from app_log where created_at > now() - interval '15 minutes' and level in ('error','warn') order by created_at desc limit 20;
            SQL
