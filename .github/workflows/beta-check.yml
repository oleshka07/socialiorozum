name: beta-check

# Службова гілка. Лише ЧИТАННЯ сервера (діагностика) або заливка файлів у медіатеку кабінету через його ж
# разове посилання. 29.09: бета після монтажу відео - версія, здоров'я, маркери і ПРОБНИЙ МОНТАЖ ffmpeg у
# контейнері беті (тимчасова тека, нічого не пише ні в базу, ні в медіатеку): чи є в Alpine-ffmpeg усі
# фільтри (ass, zoompan, boxblur, loudnorm, amix, tpad, сегментатор) і шрифт субтитрів. Другий прохід: ffmpeg 8
# відмовив «-vf crop=…» у пробі - чи працюють ті -vf, що їх викликає рушій (кадри для video_frames, рілс). Третій:
# причина - не ffmpeg 8, а stdin: скрипт іде в sh через stdin, і ffmpeg без -nostdin з'їдав його байти.
# Далі: стан Telegram-бота беті до і після деплою 60ae725 (бета бере свого спільного бота) - лише читання:
# id ботів (без токенів), куди веде вебхук (хост і вид шляху), рядки кабінетів, журнал tgbot.
# 30.09: під сповіщення про збої - які warn/error реально бувають за 30 днів (прод і бета), чи є куди слати
# (ADMIN_EMAILS, Resend, Telegram адміна), баланси провайдерів (OpenRouter, ElevenLabs, Deepgram - лише цифри),
# бекапи, диск і фільтри ffmpeg для переходів і музики. Нічого не пише.
# Далі - після деплою f475477: сповіщення (таблиці, рядки, налаштування), запасний маршрут (чи є ключ OpenAI -
# лише так/ні), привʼязка Telegram до акаунта (tg_owner.user_id - під вибір бренду в боті), пости з бота за 2 дні,
# монтажі й чи має ключ ElevenLabs право Music (навмисно кривий запит - нічого не генерує).
# Далі - після 9bee32a (бренд у боті): версія, здоров'я, код у контейнері, команди бота (getMyCommands), привʼязки,
# сповіщення й warn/error журналу за 20 хв.

on:
  push:
    branches: [beta-check]
  workflow_dispatch:
    inputs:
      link:
        description: "Разове посилання для заливки (https://…/mcp/upload/…)"
        required: false
        default: ""

jobs:
  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: After 9bee32a - brand in bot, commands, logs (read-only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 6m
          script: |
            echo "зараз $(date -u +%d.%m\ %H:%M) UTC"
            cd "${{ secrets.APP_DIR }}-beta/server"
            echo "HEAD $(git -C .. rev-parse --short HEAD)"
            docker compose ps app --format '{{.Name}} {{.Status}}'
            curl -s -o /dev/null -w "health %{http_code}\n" "http://127.0.0.1:$(grep -E '^APP_PORT=' .env | cut -d= -f2 | grep . || echo 8081)/health"
            docker compose exec -T app sh -c 'ls -la /app/dist/tgbrand.js | cut -c1-80; grep -c "sendBrandPicker\|sendDrafts" /app/dist/tgbot.js'
            docker compose logs --since 15m app 2>&1 | grep -aiE "error|warn|alerts|tgbot" | grep -avE "DeprecationWarning" | tail -12
            JS=$(cat <<'EOF'
            const { q } = await import('/app/dist/db.js');
            const { env } = await import('/app/dist/env.js');
            const sec = (await q("select value from app_secret where name='TELEGRAM_BOT_TOKEN'"))[0]?.value || process.env.TELEGRAM_BOT_TOKEN || '';
            const tok = sec;
            const r = await fetch('https://api.telegram.org/bot' + tok + '/getMyCommands').then((x) => x.json()).catch((e) => ({ err: e.message }));
            console.log('команди бота: ' + (r.result || []).map((c) => '/' + c.command).join(' ') + (r.ok ? '' : ' ' + JSON.stringify(r).slice(0, 120)));
            const me = await fetch('https://api.telegram.org/bot' + tok + '/getMe').then((x) => x.json()).catch(() => ({}));
            console.log('бот: @' + (me.result?.username || '?'));
            const o = await q("select o.workspace_id, o.user_id is not null linked, (select count(*)::int from workspace_member m where m.user_id=o.user_id) brands from tg_owner o order by o.created_at");
            console.log('tg_owner: ' + o.map((x) => String(x.workspace_id).slice(0, 8) + (x.linked ? ' (акаунт відомий, брендів ' + x.brands + ')' : ' (без акаунта)')).join(' · '));
            const al = await q("select id, severity, kind, left(title,80) t, count, notified_at is not null sent, resolved_at is not null res from ops_alert order by last_at desc limit 5");
            for (const a of al) console.log('  alert #' + a.id + ' ' + a.severity + ' ' + a.kind + ' ×' + a.count + ' sent=' + a.sent + ' res=' + a.res + ' ' + a.t);
            const lg = await q("select level, scope, left(message,160) m, to_char(created_at at time zone 'UTC','HH24:MI') c from app_log where created_at > now() - interval '20 minutes' and level in ('warn','error') order by created_at desc limit 10");
            for (const l of lg) console.log('  ' + l.c + ' ' + l.level[0] + ' ' + l.scope + ': ' + l.m.replace(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/g, '***'));
            process.exit(0);
            EOF
            )
            docker compose exec -T app node --input-type=module -e "$JS" 2>&1 | tail -25

  drop:
    if: github.event_name == 'workflow_dispatch' && inputs.link != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload media-drop via one-time link
        env:
          LINK: ${{ inputs.link }}
        run: |
          echo "::add-mask::$LINK"
          case "$LINK" in
            https://*/mcp/upload/*) ;;
            *) echo "не схоже на разове посилання заливки"; exit 1 ;;
          esac
          ls -la media-drop
          curl -fsS "$LINK/sh" -o holos-upload.sh
          sh holos-upload.sh media-drop
