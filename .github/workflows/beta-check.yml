name: beta-check

# Разова діагностика (запуск: push у гілку beta-check). Лише ЧИТАННЯ, нічого не змінює й не перезапускає.
# 1) rozum-app (інший проєкт на тому ж сервері) позначений unhealthy - чому саме: налаштування
#    перевірки здоровʼя, останні її результати, чи відповідає застосунок, хвіст логу (замасковано).
# 2) Перед перемиканням адрес: чи передають vhost-и socialio заголовок Host (інакше редірект зі старої
#    адреси не спрацює), як налаштовано vhost беті, чи бачить сервер DNS beta.holos.rozum.one.

on:
  push:
    branches: [beta-check]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: rozum-app health + vhosts (read-only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 3m
          script: |
            mask() { sed -E -e 's/([A-Za-z0-9._%+-]{1,3})[A-Za-z0-9._%+-]*@([A-Za-z0-9.-]+)/\1***@\2/g' \
                            -e 's/[0-9a-fA-F]{24,}/<hex>/g' -e 's/[0-9]{6,}:[A-Za-z0-9_-]{30,}/<bot-token>/g' \
                            -e 's/(eyJ[A-Za-z0-9_-]{10,})\.[A-Za-z0-9._-]+/<jwt>/g' \
                            -e 's/((key|token|secret|password|passwd|pwd)[^=:]{0,20}[=:] *)[^ ,"]+/\1<masked>/Ig'; }
            SUDO=""; [ "$(id -u)" != 0 ] && SUDO="sudo -n"
            echo "=== rozum-app: стан ==="
            docker inspect rozum-app --format 'status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}} streak={{.State.Health.FailingStreak}}{{end}} started={{.State.StartedAt}} restarts={{.RestartCount}} image={{.Config.Image}}' 2>&1
            echo "compose dir: $(docker inspect rozum-app --format '{{index .Config.Labels "com.docker.compose.project.working_dir"}}' 2>/dev/null)  project: $(docker inspect rozum-app --format '{{index .Config.Labels "com.docker.compose.project"}}' 2>/dev/null)  service: $(docker inspect rozum-app --format '{{index .Config.Labels "com.docker.compose.service"}}' 2>/dev/null)"
            echo "=== rozum-app: як перевіряється здоровʼя ==="
            docker inspect rozum-app --format '{{json .Config.Healthcheck}}' 2>&1 | mask
            echo "=== rozum-app: останні результати перевірки ==="
            docker inspect rozum-app --format '{{range .State.Health.Log}}{{.Start}} exit={{.ExitCode}} :: {{printf "%.300s" .Output}}{{"\n"}}{{end}}' 2>&1 | tail -5 | mask
            echo "=== rozum-app: чи відповідає ззовні контейнера (порт 3120) ==="
            for p in / /health /api/health /healthz; do echo "127.0.0.1:3120$p -> $(curl -s -m 8 -o /dev/null -w '%{http_code}' http://127.0.0.1:3120$p)"; done
            echo "=== rozum-app: що є в контейнері для перевірки ==="
            docker exec rozum-app sh -c 'command -v curl || echo "curl: НЕМА"; command -v wget || echo "wget: НЕМА"; command -v node || true' 2>&1 | head -5
            echo "=== rozum-app: хвіст логу (замасковано) ==="
            docker logs --tail 30 rozum-app 2>&1 | cut -c1-220 | mask
            echo "=== rozum-postgres ==="
            docker inspect rozum-postgres --format 'status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{end}}' 2>&1
            echo
            echo "=== vhost socialio (прод): Host і проксі ==="
            SOC=$(readlink -f /etc/nginx/sites-enabled/socialio.rozum.one.conf)
            $SUDO grep -nE "server_name|listen|proxy_pass|proxy_set_header Host|client_max_body_size|ssl_certificate |proxy_read_timeout" "$SOC"
            echo "=== vhost beta.socialio ==="
            BSOC=$(readlink -f /etc/nginx/sites-enabled/beta.socialio.rozum.one)
            $SUDO grep -nE "server_name|listen|proxy_pass|proxy_set_header Host|client_max_body_size|ssl_certificate |proxy_read_timeout" "$BSOC"
            echo "=== DNS з сервера ==="
            getent hosts beta.holos.rozum.one holos.rozum.one || echo "не резолвиться"
            curl -s -m 5 -4 ifconfig.me 2>/dev/null && echo " <- IP сервера"
            echo "=== прод: версія й здоровʼя ==="
            echo "HEAD $(git -C "${{ secrets.APP_DIR }}" rev-parse --short HEAD) | beta HEAD $(git -C "${{ secrets.APP_DIR }}-beta" rev-parse --short HEAD)"
            curl -s -m 5 -o /dev/null -w "prod health %{http_code}\n" http://127.0.0.1:8080/health
            curl -s -m 5 -o /dev/null -w "beta health %{http_code}\n" http://127.0.0.1:8081/health
            ls -lh /opt/socialio-backups 2>/dev/null | grep -- "-db-" | tail -2
