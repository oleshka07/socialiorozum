name: beta-check

# Службова гілка. Лише ЧИТАННЯ сервера (діагностика) або заливка файлів у медіатеку кабінету через його ж
# разове посилання. 29.09: бета після монтажу відео - версія, здоров'я, маркери і ПРОБНИЙ МОНТАЖ ffmpeg у
# контейнері беті (тимчасова тека, нічого не пише ні в базу, ні в медіатеку): чи є в Alpine-ffmpeg усі
# фільтри (ass, zoompan, boxblur, loudnorm, amix, tpad, сегментатор) і шрифт субтитрів. Другий прохід: ffmpeg 8
# відмовив «-vf crop=…» у пробі - чи працюють ті -vf, що їх викликає рушій (кадри для video_frames, рілс). Третій:
# причина - не ffmpeg 8, а stdin: скрипт іде в sh через stdin, і ffmpeg без -nostdin з'їдав його байти.
# Далі: стан Telegram-бота беті до і після деплою 60ae725 (бета бере свого спільного бота) - лише читання:
# id ботів (без токенів), куди веде вебхук (хост і вид шляху), рядки кабінетів, журнал tgbot.
# 30.09: під сповіщення про збої - які warn/error реально бувають за 30 днів (прод і бета), чи є куди слати
# (ADMIN_EMAILS, Resend, Telegram адміна), баланси провайдерів (OpenRouter, ElevenLabs, Deepgram - лише цифри),
# бекапи, диск і фільтри ffmpeg для переходів і музики. Нічого не пише.
# Далі - після деплою f475477: сповіщення (таблиці, рядки, налаштування), запасний маршрут (чи є ключ OpenAI -
# лише так/ні), привʼязка Telegram до акаунта (tg_owner.user_id - під вибір бренду в боті), пости з бота за 2 дні,
# монтажі й чи має ключ ElevenLabs право Music (навмисно кривий запит - нічого не генерує).
# Далі - після 9bee32a (бренд у боті): версія, здоров'я, код у контейнері, команди бота (getMyCommands), привʼязки,
# сповіщення й warn/error журналу за 20 хв.
# Далі - ПРОД після промоушну 455af3c (усе з беті): версія, health, сторінки, стара адреса, журнал старту, ffmpeg і шрифт,
# нові таблиці, бот (команди, вебхук), привʼязки, сповіщення, кількість даних і warn/error за 25 хв.
# Далі - бета: імʼя файлу змонтованого рілса про бетон (#91d1179b) і чи віддається він публічно - щоб скопіювати
# його у Vary Servis через upload_media конектора (рішення Олега в картці holos-bot-brand).
# Далі - бета після монтажу v3: версія, здоров'я, код у контейнері, колонка обкладинки, фільтри ffmpeg і проба
# libass у тимчасовій теці контейнера (гачок-плашка, субтитри на плашці, шторка) - у базу й медіатеку не пише.

on:
  push:
    branches: [beta-check]
  workflow_dispatch:
    inputs:
      link:
        description: "Разове посилання для заливки (https://…/mcp/upload/…)"
        required: false
        default: ""

jobs:
  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Beta after montage v3 - version, health, code, cover column, ffmpeg + libass probe (read-only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 5m
          script: |
            echo "зараз $(date -u +%d.%m\ %H:%M) UTC"
            cd "${{ secrets.APP_DIR }}-beta/server"
            echo "HEAD $(git -C .. rev-parse --short HEAD)"
            docker compose ps app --format '{{.Name}} {{.Status}}'
            curl -s -o /dev/null -w "health %{http_code}\n" http://127.0.0.1:8081/health
            echo "--- код у контейнері"
            docker compose exec -T app sh -c 'grep -c "templatePlan\|subLook\|speechKeeps\|endCardText" /app/dist/montage-plan.js; grep -c "setReelCover\|tightenClip\|autoHook" /app/dist/montage.js; grep -c "cover_url" /app/dist/meta.js; grep -c "keepLang" /app/dist/pipeline.js; grep -c "mntTplBtn\|cmpCover" /app/public/app.js; grep -c "mvPanel" /app/public/app.html; grep -o "source not in ([^)]*)" /app/dist/server.js | head -1'
            echo "--- база: колонка обкладинки й стиль відео"
            JS=$(cat <<'EOF'
            const { q } = await import('/app/dist/db.js');
            const c = await q("select column_name, data_type from information_schema.columns where table_name='post' and column_name='reel_cover'");
            console.log('post.reel_cover: ' + (c[0] ? c[0].data_type : 'НЕМА'));
            const s = await q("select count(*)::int as n from settings_block where key='montage_style'");
            console.log('montage_style рядків: ' + s[0].n);
            const cov = await q("select count(*)::int as n from media_asset where source='cover'");
            console.log('обкладинок: ' + cov[0].n);
            process.exit(0);
            EOF
            )
            docker compose exec -T app node --input-type=module -e "$JS" 2>&1 | tail -5
            echo "--- ffmpeg: фільтри v3"
            docker compose exec -T app sh -c 'ffmpeg -hide_banner -filters 2>/dev/null | grep -E " (xfade|vstack|drawbox|boxblur|ass|concat|atrim|asplit|afade) " | awk "{print \$2}" | tr "\n" " "; echo'
            echo "--- проба libass у тимчасовій теці: гачок-плашка кольору бренду, субтитри на плашці, шторка"
            PROBE=$(cat <<'EOF'
            const P = await import('/app/dist/montage-plan.js');
            const { writeFileSync } = await import('node:fs');
            const look = P.subLook('box', '#FF2F78', 'low');
            const words = [{w:'Dnes',s:0.2,e:0.6},{w:'řežeme',s:0.6,e:1.1},{w:'beton',s:1.1,e:1.6},{w:'ručně.',s:1.6,e:2.2}];
            const ev = [...P.karaokeEvents(P.groupCues(words, look.cue), look.style, look.highlight), ...P.hookEvents('Řežeme beton ručně', 0.05, 2.6)];
            writeFileSync('/tmp/v3probe/s.ass', P.assDoc(look.style, ev));
            console.log('ass ok ' + ev.length + ' подій');
            process.exit(0);
            EOF
            )
            docker compose exec -T app sh -c 'rm -rf /tmp/v3probe && mkdir -p /tmp/v3probe'
            docker compose exec -T app node --input-type=module -e "$PROBE" 2>&1 | tail -3
            docker compose exec -T app sh -c 'cd /tmp/v3probe && ffmpeg -nostdin -hide_banner -loglevel error -f lavfi -i color=c=0x2266cc:s=1080x1920:d=1.5 -f lavfi -i color=c=0xcc2222:s=1080x1920:d=1.5 -filter_complex "[0:v][1:v]xfade=transition=wipeleft:duration=0.5:offset=1[x];[x]ass=s.ass[v]" -map "[v]" -r 30 -c:v libx264 -preset ultrafast -pix_fmt yuv420p t.mp4 && echo "рендер ok $(ffprobe -v error -show_entries format=duration -of csv=p=0 t.mp4) с"'
            docker compose exec -T app sh -c 'cd /tmp/v3probe && for t in 1.0 1.4; do ffmpeg -nostdin -hide_banner -loglevel error -ss $t -i t.mp4 -frames:v 1 -vf "crop=4:4:538:450,scale=1:1" -f rawvideo -pix_fmt rgb24 - | od -An -tu1 | tr -s " " | sed "s/^/гачок @$t с RGB:/"; done; ffmpeg -nostdin -hide_banner -loglevel error -ss 1.3 -i t.mp4 -frames:v 1 -vf "crop=4:4:40:1000,scale=1:1" -f rawvideo -pix_fmt rgb24 - | od -An -tu1 | tr -s " " | sed "s/^/шторка зліва @1.3 RGB:/"; ffmpeg -nostdin -hide_banner -loglevel error -ss 1.3 -i t.mp4 -frames:v 1 -vf "crop=4:4:1030:1000,scale=1:1" -f rawvideo -pix_fmt rgb24 - | od -An -tu1 | tr -s " " | sed "s/^/шторка справа @1.3 RGB:/"'
            docker compose exec -T app sh -c 'rm -rf /tmp/v3probe'
            echo "--- журнал беті: warn/error за 20 хв"
            JS2=$(cat <<'EOF'
            const { q } = await import('/app/dist/db.js');
            const r = await q("select created_at, level, source, left(message, 160) as m from app_log where created_at > now() - interval '20 minutes' and level in ('warn','error') order by created_at desc limit 12");
            for (const x of r) console.log(new Date(x.created_at).toISOString().slice(11, 19) + ' ' + x.level + ' ' + x.source + ': ' + x.m);
            if (!r.length) console.log('нічого');
            process.exit(0);
            EOF
            )
            docker compose exec -T app node --input-type=module -e "$JS2" 2>&1 | tail -14

  drop:
    if: github.event_name == 'workflow_dispatch' && inputs.link != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload media-drop via one-time link
        env:
          LINK: ${{ inputs.link }}
        run: |
          echo "::add-mask::$LINK"
          case "$LINK" in
            https://*/mcp/upload/*) ;;
            *) echo "не схоже на разове посилання заливки"; exit 1 ;;
          esac
          ls -la media-drop
          curl -fsS "$LINK/sh" -o holos-upload.sh
          sh holos-upload.sh media-drop
