# Далі - після хотфіксу 761d958 (прод: політика й умови) і 3150429 (бета): сторінки, код у контейнері, тривоги й журнал.
# Далі - бета після коментарів у боті: версія, здоров'я, код у контейнері, таблиця comment_notice (скільки рядків за
# станом - чи пройшов перший прохід воркера), команди бота (getMyCommands), warn/error журналу. Нічого не пише.
# Далі - бета після YouTube і TikTok як мереж: версія, здоров'я, код у контейнері, представлення post_published і
# унікальні індекси «раз на пост», нові колонки, чи задано ключі Google/TikTok (лише так/ні), підключення й
# публікації YouTube/TikTok (лише кількості), warn/error журналу. Нічого не пише.
# Далі - бета після TikTok-перевірки (англійський режим ?review=tiktok, блок TikTok словами TikTok, «Новий пост»):
# версія, здоров'я, код у контейнері, колонка аватара, чи задано ключі TikTok і чи це sandbox (лише так/ні),
# підключення TikTok (кількість), warn/error журналу. Нічого не пише.
# Далі - ПРОД після промоушну cf505e3 (YouTube і TikTok як мережі, шлях до перевірки TikTok, коментарі в боті,
# монтаж v3, примітки 30.09): версія, health, сторінки, стара адреса, код і фільтри ffmpeg у контейнері, міграція
# (таблиці, колонки, індекси, post_published), ключі так/ні, бот (команди, вебхук), перший прохід коментарів,
# тривоги й warn/error журналу. Нічого не пише.

# 02.10 - сертифікат holos.rozum.one: Олег бачить «прострочений з 23.08». Що віддається ззовні (раннер, IPv4: DNS,
# ланцюжок, дати, історія з crt.sh) і на сервері по кожній адресі (IPv4 / IPv6 / без SNI), які файли сертифікатів
# підтягує nginx і їхні дати, certbot (сертифікати, таймер, журнал). Нічого не пише й не продовжує.
# Другий прохід: сам сертифікат holos дійсний до 27.12 - шукаємо «23.08» у ЛАНЦЮЖКУ (проміжний / крос-підпис), у
# старих випусках цього імені (archive), у UDP 443 (HTTP/3) і контейнерах; перевірка ланцюжка «по-старому» (-no_alt_chains).

on:
  push:
    branches: [beta-check]
  workflow_dispatch:
    inputs:
      link:
        description: "Разове посилання для заливки (https://…/mcp/upload/…)"
        required: false
        default: ""

jobs:
  beta:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: certificate chain as served (runner)
        run: |
          chain() {
            echo | timeout 15 openssl s_client -connect "$1:443" -servername "$1" -showcerts 2>/dev/null | awk '/BEGIN CERT/,/END CERT/' > /tmp/c.pem
            rm -f /tmp/cc-*; csplit -s -z -f /tmp/cc- /tmp/c.pem '/-----BEGIN CERTIFICATE-----/' '{*}'
            i=0; for f in /tmp/cc-*; do i=$((i+1)); echo "   #$i $(openssl x509 -in "$f" -noout -subject -issuer -startdate -enddate | tr '\n' ' ' | sed 's/  */ /g')"; done
          }
          for d in holos.rozum.one beta.holos.rozum.one socialio.rozum.one; do
            echo "== $d - ланцюжок, як його віддає сервер"
            chain "$d"
            echo "   перевірка як у сучасних клієнтів: $(echo | timeout 15 openssl s_client -connect "$d:443" -servername "$d" -verify_return_error 2>&1 | grep -m1 -E 'Verify return code' | sed 's/^ *//')"
            echo "   перевірка «по-старому» (-no_alt_chains): $(echo | timeout 15 openssl s_client -connect "$d:443" -servername "$d" -no_alt_chains 2>&1 | grep -m1 -E 'Verify return code' | sed 's/^ *//')"
          done
          echo "== HTTP-заголовки holos (Alt-Svc / HSTS)"
          curl -sSI --max-time 15 https://holos.rozum.one/ | grep -iE '^(alt-svc|strict-transport|server):' || echo "   нема Alt-Svc/HSTS"

      - name: chain files, old issuances, UDP 443 (server, read-only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 5m
          script: |
            T=$(mktemp -d)
            for n in holos.rozum.one beta.holos.rozum.one socialio.rozum.one; do
              echo "== fullchain.pem $n (на диску)"
              csplit -s -z -f "$T/$n-" /etc/letsencrypt/live/$n/fullchain.pem '/-----BEGIN CERTIFICATE-----/' '{*}'
              for f in "$T/$n-"*; do echo "   $(openssl x509 -in "$f" -noout -subject -issuer -startdate -enddate | tr '\n' ' ' | sed 's/  */ /g')"; done
            done
            echo "== усі випуски holos.rozum.one (archive)"
            for f in /etc/letsencrypt/archive/holos.rozum.one/cert*.pem; do echo "   $(basename $f): $(openssl x509 -in "$f" -noout -startdate -enddate -issuer | tr '\n' ' ' | sed 's/  */ /g')"; done
            echo "== будь-який сертифікат на диску, що спливає 23 серпня"
            for f in $(find /etc/letsencrypt /etc/nginx /etc/ssl /opt -maxdepth 6 -type f \( -name '*.pem' -o -name '*.crt' \) ! -name '*privkey*' ! -name '*key*' 2>/dev/null); do
              e=$(openssl x509 -in "$f" -noout -enddate 2>/dev/null) || continue
              case "$e" in *"Aug 23"*) echo "   $f → $(openssl x509 -in "$f" -noout -subject | sed 's/  */ /g') · $e";; esac
            done
            echo "== UDP 443 (HTTP/3) і контейнери з 80/443"
            ss -lunpH '( sport = :443 )' | awk '{print "   udp " $4, $6}' | sed -E 's/users:\(\("([^"]+)".*/\1/'
            docker ps --format '{{.Names}} {{.Ports}}' 2>/dev/null | grep -E ':(80|443)->' | sed 's/^/   /' || true
            echo "   (кінець)"
            rm -rf "$T"

  drop:
    if: github.event_name == 'workflow_dispatch' && inputs.link != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload media-drop via one-time link
        env:
          LINK: ${{ inputs.link }}
        run: |
          echo "::add-mask::$LINK"
          case "$LINK" in
            https://*/mcp/upload/*) ;;
            *) echo "не схоже на разове посилання заливки"; exit 1 ;;
          esac
          ls -la media-drop
          curl -fsS "$LINK/sh" -o holos-upload.sh
          sh holos-upload.sh media-drop
