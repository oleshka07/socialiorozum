name: beta-check

# Разова діагностика (запуск: push у гілку beta-check). Лише ЧИТАННЯ, нічого не змінює й не перезапускає.
# 28.09: хотфікс політики (b0b3ef7) на проді і бета після злиття (cf22a28) - що віддається і чи живе.

on:
  push:
    branches: [beta-check]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Privacy hotfix on prod + beta after merge (read-only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 5m
          script: |
            echo "зараз $(date -u +%d.%m\ %H:%M) UTC · prod HEAD $(git -C "${{ secrets.APP_DIR }}" rev-parse --short HEAD) · beta HEAD $(git -C "${{ secrets.APP_DIR }}-beta" rev-parse --short HEAD)"
            for p in 8080 8081; do
              echo "--- порт $p ---"
              echo "health: $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:$p/health)"
              echo "privacy: $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:$p/privacy) · business.manage: $(curl -s http://127.0.0.1:$p/privacy | grep -c 'business.manage') · $(curl -s http://127.0.0.1:$p/privacy | grep -o 'Last updated: [0-9]* [A-Za-z]* [0-9]*')"
            done
            echo "через nginx: $(curl -s -o /dev/null -w '%{http_code}' https://holos.rozum.one/privacy) · $(curl -s https://holos.rozum.one/privacy | grep -c 'Google Business Profile')"
            for d in "${{ secrets.APP_DIR }}" "${{ secrets.APP_DIR }}-beta"; do
              cd "$d/server" && echo "$d: $(docker compose ps app --format '{{.Status}}')"
            done
