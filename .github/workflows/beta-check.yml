name: beta-check

# Разова діагностика (запуск: push у гілку beta-check). Лише ЧИТАННЯ з бази, без секретів:
# журнал підключення Threads з обох стеків + структура кабінетів двох акаунтів (пошти замасковано).

on:
  push:
    branches: [beta-check]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Threads connect log + cabinets (prod + beta, read-only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 3m
          script: |
            for d in "${{ secrets.APP_DIR }}" "${{ secrets.APP_DIR }}-beta"; do
            echo "=================== $d ==================="
            cd "$d/server" || continue
            docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -P pager=off' <<'SQL'
            \echo '--- threads: журнал за 21 день (новіші зверху) ---'
            select to_char(l.created_at at time zone 'Europe/Kyiv','DD.MM HH24:MI:SS') as t, l.level,
                   left(regexp_replace(regexp_replace(l.message,'\s+',' ','g'),'([A-Za-z0-9._%+-]{1,4})[A-Za-z0-9._%+-]*@','\1***@','g'),420) as message,
                   left(coalesce(l.meta::text,''),260) as meta,
                   coalesce(left(u.email,4)||'***@'||split_part(u.email,'@',2),'-') as who
              from app_log l left join app_user u on u.id = l.user_id
             where l.scope = 'threads' and l.created_at > now() - interval '21 days'
             order by l.created_at desc limit 80;
            \echo '--- кабінети двох акаунтів ---'
            select left(u.email,4)||'***' as who, u.created_at::date as reg, (u.deleted_at is not null) as deleted,
                   left(w.id::text,8) as ws, split_part(w.name,':',1) as kind, coalesce(w.title,'') as title, m.role,
                   (u.workspace_id = w.id) as home,
                   (select count(*) from workspace_member x where x.workspace_id = w.id) as members,
                   exists(select 1 from threads_config t where t.workspace_id = w.id) as threads,
                   w.created_at::date as ws_created
              from app_user u join workspace_member m on m.user_id = u.id join workspace w on w.id = m.workspace_id
             where u.email like 'konstantin%' or u.email like 'o.stepeniev%'
             order by u.email, m.role desc;
            \echo '--- акаунт/кабінети: події за 21 день ---'
            select to_char(l.created_at at time zone 'Europe/Kyiv','DD.MM HH24:MI') as t, l.level, l.scope,
                   left(regexp_replace(l.message,'([A-Za-z0-9._%+-]{1,4})[A-Za-z0-9._%+-]*@','\1***@','g'),200) as message,
                   coalesce(left(u.email,4)||'***','-') as who
              from app_log l left join app_user u on u.id = l.user_id
             where l.scope in ('account','workspace') and l.created_at > now() - interval '21 days'
               and (u.email like 'konstantin%' or u.email like 'o.stepeniev%')
             order by l.created_at desc limit 40;
            SQL
            done
