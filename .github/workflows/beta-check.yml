name: beta-check

# Разова діагностика (запуск: push у гілку beta-check). Лише ЧИТАННЯ, нічого не змінює й не перезапускає.
# Питання: що зараз стоїть на holos.rozum.one (DNS уже веде на цей сервер) - чи є там vhost nginx,
# сертифікат і чужий застосунок, перш ніж переносити туди socialio. Секретів не виводимо:
# з конфігів nginx беремо лише server_name / listen / proxy_pass / root / return.

on:
  push:
    branches: [beta-check]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: holos.rozum.one - що там зараз (read-only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 3m
          script: |
            SUDO=""; [ "$(id -u)" != 0 ] && SUDO="sudo -n"
            echo "=== nginx: увімкнені сайти ==="
            $SUDO ls -1 /etc/nginx/sites-enabled/ 2>/dev/null; $SUDO ls -1 /etc/nginx/conf.d/ 2>/dev/null
            echo "=== які конфіги згадують holos ==="
            HF=$($SUDO grep -rlis "holos" /etc/nginx/sites-enabled/ /etc/nginx/conf.d/ /etc/nginx/sites-available/ 2>/dev/null)
            [ -z "$HF" ] && echo "жоден конфіг nginx не згадує holos"
            for f in $HF; do echo "--- $f"; $SUDO grep -nE "server_name|listen|proxy_pass|root |return |ssl_certificate " "$f"; done
            echo "=== default_server (куди падає невідомий домен) ==="
            $SUDO grep -rnE "default_server" /etc/nginx/sites-enabled/ /etc/nginx/conf.d/ 2>/dev/null || echo "явного default_server нема - бере перший vhost за алфавітом"
            echo "=== сертифікати Let's Encrypt ==="
            $SUDO ls -1 /etc/letsencrypt/live/ 2>/dev/null | grep -v README
            for c in $($SUDO ls -1 /etc/letsencrypt/live/ 2>/dev/null | grep -v README); do
              echo "$c: $($SUDO openssl x509 -in /etc/letsencrypt/live/$c/cert.pem -noout -ext subjectAltName 2>/dev/null | tail -1 | tr -d ' ')"
            done
            echo "=== відповідь holos.rozum.one ==="
            for u in http://holos.rozum.one/ https://holos.rozum.one/; do
              curl -sS -m 10 -o /dev/null -w "$u -> %{http_code} %{redirect_url}\n" "$u" 2>&1 | head -2
            done
            echo "title (https, без перевірки сертифіката): $(curl -skS -m 10 https://holos.rozum.one/ 2>/dev/null | grep -io '<title>[^<]*' | head -1)"
            echo "сертифікат, який віддає https://holos.rozum.one:"
            echo | openssl s_client -connect holos.rozum.one:443 -servername holos.rozum.one 2>/dev/null | openssl x509 -noout -subject -ext subjectAltName 2>/dev/null | tr -s ' ' | head -4
            echo "=== контейнери (імена, образи, порти) ==="
            docker ps --format '{{.Names}}\t{{.Image}}\t{{.Ports}}\t{{.Status}}' 2>/dev/null
            echo "=== /opt ==="
            ls -1 /opt 2>/dev/null
