name: beta-check

# Службова гілка. Лише ЧИТАННЯ сервера (діагностика) або заливка файлів у медіатеку кабінету через його ж
# разове посилання. 29.09: бета після монтажу відео - версія, здоров'я, маркери і ПРОБНИЙ МОНТАЖ ffmpeg у
# контейнері беті (тимчасова тека, нічого не пише ні в базу, ні в медіатеку): чи є в Alpine-ffmpeg усі
# фільтри (ass, zoompan, boxblur, loudnorm, amix, tpad, сегментатор) і шрифт субтитрів. Другий прохід: ffmpeg 8
# відмовив «-vf crop=…» у пробі - чи працюють ті -vf, що їх викликає рушій (кадри для video_frames, рілс). Третій:
# причина - не ffmpeg 8, а stdin: скрипт іде в sh через stdin, і ffmpeg без -nostdin з'їдав його байти.
# Далі: стан Telegram-бота беті до і після деплою 60ae725 (бета бере свого спільного бота) - лише читання:
# id ботів (без токенів), куди веде вебхук (хост і вид шляху), рядки кабінетів, журнал tgbot.
# 30.09: під сповіщення про збої - які warn/error реально бувають за 30 днів (прод і бета), чи є куди слати
# (ADMIN_EMAILS, Resend, Telegram адміна), баланси провайдерів (OpenRouter, ElevenLabs, Deepgram - лише цифри),
# бекапи, диск і фільтри ffmpeg для переходів і музики. Нічого не пише.
# Далі - після деплою f475477: сповіщення (таблиці, рядки, налаштування), запасний маршрут (чи є ключ OpenAI -
# лише так/ні), привʼязка Telegram до акаунта (tg_owner.user_id - під вибір бренду в боті), пости з бота за 2 дні,
# монтажі й чи має ключ ElevenLabs право Music (навмисно кривий запит - нічого не генерує).
# Далі - після 9bee32a (бренд у боті): версія, здоров'я, код у контейнері, команди бота (getMyCommands), привʼязки,
# сповіщення й warn/error журналу за 20 хв.
# Далі - ПРОД після промоушну 455af3c (усе з беті): версія, health, сторінки, стара адреса, журнал старту, ffmpeg і шрифт,
# нові таблиці, бот (команди, вебхук), привʼязки, сповіщення, кількість даних і warn/error за 25 хв.
# Далі - бета: імʼя файлу змонтованого рілса про бетон (#91d1179b) і чи віддається він публічно - щоб скопіювати
# його у Vary Servis через upload_media конектора (рішення Олега в картці holos-bot-brand).
# Далі - бета після монтажу v3: версія, здоров'я, код у контейнері, колонка обкладинки, фільтри ffmpeg і проба
# libass у тимчасовій теці контейнера (гачок-плашка, субтитри на плашці, шторка) - у базу й медіатеку не пише.
# Далі - під примітки Олега в чек-листі 30.09: чи падає читання коментарів Threads (журнал), яка головна модель у
# кабінетах (OpenRouter чи OpenAI), Vary Servis (пояс, бриф, канали Telegram), нові акаунти для рецензента Meta,
# канали Telegram у брендах, чи є підключення YouTube/TikTok і чи задані їхні ключі (лише так/ні), тест сповіщень.
# Далі - після хотфіксу 761d958 (прод: політика й умови) і 3150429 (бета): сторінки, код у контейнері, тривоги й журнал.
# Далі - бета після коментарів у боті: версія, здоров'я, код у контейнері, таблиця comment_notice (скільки рядків за
# станом - чи пройшов перший прохід воркера), команди бота (getMyCommands), warn/error журналу. Нічого не пише.
# Далі - бета після YouTube і TikTok як мереж: версія, здоров'я, код у контейнері, представлення post_published і
# унікальні індекси «раз на пост», нові колонки, чи задано ключі Google/TikTok (лише так/ні), підключення й
# публікації YouTube/TikTok (лише кількості), warn/error журналу. Нічого не пише.
# Далі - бета після TikTok-перевірки (англійський режим ?review=tiktok, блок TikTok словами TikTok, «Новий пост»):
# версія, здоров'я, код у контейнері, колонка аватара, чи задано ключі TikTok і чи це sandbox (лише так/ні),
# підключення TikTok (кількість), warn/error журналу. Нічого не пише.
# Далі - ПРОД після промоушну cf505e3 (YouTube і TikTok як мережі, шлях до перевірки TikTok, коментарі в боті,
# монтаж v3, примітки 30.09): версія, health, сторінки, стара адреса, код і фільтри ffmpeg у контейнері, міграція
# (таблиці, колонки, індекси, post_published), ключі так/ні, бот (команди, вебхук), перший прохід коментарів,
# тривоги й warn/error журналу. Нічого не пише.

# 02.10 - сертифікат holos.rozum.one: Олег бачить «прострочений з 23.08». Що віддається ззовні (раннер, IPv4: DNS,
# ланцюжок, дати, історія з crt.sh) і на сервері по кожній адресі (IPv4 / IPv6 / без SNI), які файли сертифікатів
# підтягує nginx і їхні дати, certbot (сертифікати, таймер, журнал). Нічого не пише й не продовжує.
# Другий прохід: сам сертифікат holos дійсний до 27.12 - шукаємо «23.08» у ЛАНЦЮЖКУ (проміжний / крос-підпис), у
# старих випусках цього імені (archive), у UDP 443 (HTTP/3) і контейнерах; перевірка ланцюжка «по-старому» (-no_alt_chains).
# 03.10 - посилання на EvidujZdarma з holos (SEO): чи відкриваються https://evidujzdarma.cz/ і /musim-evidovat
# (код, редиректи, заголовок, h1, мова, robots, canonical, «připravujeme», чи є квіз і перевірка IČO) - лише з раннера.
# Далі - бета після посилань на EvidujZdarma: що реально віддає beta.holos (вхід за PIN беті, як у тестувальника) -
# блок «Від тієї ж команди», посилання без rel/UTM, підвали юридичних сторінок; прод поки без змін. Нічого не пише.
# Далі - ПРОД після промоушну 00f0508 (посилання на EvidujZdarma): що віддає holos.rozum.one ззовні (лендинг, юридичні
# сторінки, robots, sitemap, meta robots), стара адреса; на сервері - HEAD, контейнер, health. Нічого не пише.
# Далі - під індексацію holos (Search Console): хто тримає DNS rozum.one (NS, RDAP), чи є вже TXT-записи підтвердження
# Google/інших, заголовки X-Robots-Tag і meta robots сторінок, що знають пошуковики (DuckDuckGo/Bing site:), що роблять
# EvidujZdarma (robots, llms.txt, теги підтвердження - зразок), і чи заходять Googlebot/Bingbot (журнал nginx, лише боти).

on:
  push:
    branches: [beta-check]
  workflow_dispatch:
    inputs:
      link:
        description: "Разове посилання для заливки (https://…/mcp/upload/…)"
        required: false
        default: ""

jobs:
  beta:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: DNS, headers, what search engines know (runner, read-only)
        run: |
          sudo apt-get -qq install -y dnsutils >/dev/null 2>&1 || true
          echo "== NS rozum.one: $(dig +short NS rozum.one | tr '\n' ' ')"
          echo "== SOA: $(dig +short SOA rozum.one)"
          echo "== A rozum.one: $(dig +short A rozum.one | tr '\n' ' ') · holos: $(dig +short A holos.rozum.one | tr '\n' ' ') · CNAME holos: $(dig +short CNAME holos.rozum.one)"
          echo "== TXT rozum.one:"; dig +short TXT rozum.one | sed 's/^/   /'
          echo "== TXT holos.rozum.one:"; dig +short TXT holos.rozum.one | sed 's/^/   /'
          echo "== TXT _dmarc: $(dig +short TXT _dmarc.rozum.one)"
          echo "== MX rozum.one: $(dig +short MX rozum.one | tr '\n' ' ')"
          echo "== RDAP rozum.one (реєстратор):"
          curl -sS --max-time 20 https://rdap.org/domain/rozum.one -L | python3 -c "
          import json,sys
          try: d=json.load(sys.stdin)
          except Exception as e: print('   не JSON',e); sys.exit()
          for e in d.get('entities',[]):
            roles=e.get('roles',[]); v=e.get('vcardArray',[None,[]])[1]
            fn=[x[3] for x in v if x and x[0]=='fn']
            if 'registrar' in roles or 'reseller' in roles: print('  ',roles,fn)
          for ev in d.get('events',[]): print('   ',ev.get('eventAction'),ev.get('eventDate'))
          print('   nameservers:',[n.get('ldhName') for n in d.get('nameservers',[])])
          " || true
          echo "== https://rozum.one: $(curl -sS -o /tmp/r.html -w '%{http_code} → %{redirect_url}' --max-time 15 https://rozum.one/) · title: $(grep -o '<title>[^<]*' /tmp/r.html | head -1)"
          for pth in / /login /register /app /forgot /tgapp /privacy; do
            h=$(curl -sS -D - -o /tmp/p.html --max-time 15 "https://holos.rozum.one$pth" | tr -d '\r')
            echo "== holos$pth: $(echo "$h" | head -1) · x-robots: $(echo "$h" | grep -i '^x-robots-tag' | cut -d' ' -f2-) · meta: $(grep -o '<meta name=\"robots\" content=\"[^\"]*' /tmp/p.html | cut -d'"' -f4)"
          done
          echo "== verification-теги на holos /:"; curl -sS https://holos.rozum.one/ | grep -oiE '<meta name="(google-site-verification|msvalidate.01|seznam-wmt|yandex-verification|facebook-domain-verification)"[^>]*>' || echo "   нема"
          echo "== EvidujZdarma (зразок):"
          for pth in /robots.txt /llms.txt /sitemap.xml /.well-known/security.txt; do
            echo "-- evidujzdarma.cz$pth: $(curl -sS -o /tmp/e.txt -w '%{http_code} %{content_type}' --max-time 15 "https://evidujzdarma.cz$pth")"
            head -c 900 /tmp/e.txt | sed 's/^/   /'; echo
          done
          curl -sS https://evidujzdarma.cz/ | grep -oiE '<meta name="(google-site-verification|msvalidate.01|seznam-wmt|yandex-verification)"[^>]*>' | sed 's/content="[^"]*"/content="…"/' || echo "   теги: нема"
          echo "== що знають пошуковики (DuckDuckGo html → Bing):"
          for q in holos.rozum.one socialio.rozum.one; do
            curl -sS --max-time 20 -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36' "https://html.duckduckgo.com/html/?q=site%3A$q" -o /tmp/d.html -w "-- ddg site:$q %{http_code}\n"
            grep -oE 'class="result__a" href="[^"]*"' /tmp/d.html | head -8 | sed 's/^/   /' || true
            grep -c 'result__a' /tmp/d.html | sed 's/^/   результатів: /'
          done
          for q in holos.rozum.one socialio.rozum.one; do
            curl -sS --max-time 20 -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36' "https://www.bing.com/search?q=site%3A$q&setlang=en-US&cc=US" -o /tmp/b.html -w "-- bing site:$q %{http_code}\n"
            grep -oE '<li class="b_algo"[^>]*>.{0,400}' /tmp/b.html | grep -oE 'href="https?://[^"]*"' | sort -u | head -8 | sed 's/^/   /' || true
          done
          curl -sS --max-time 20 -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36' "https://www.google.com/search?q=site:holos.rozum.one&hl=en&gbv=1" -o /tmp/g.html -w "-- google site:holos %{http_code}\n" || true
          grep -oE 'https?://(holos|socialio)\.rozum\.one[^"&<]*' /tmp/g.html | sort -u | head -8 | sed 's/^/   /' || true
          grep -oiE 'did not match any documents|unusual traffic|consent' /tmp/g.html | head -2 | sed 's/^/   /' || true

      - name: search bots in nginx logs, app settings keys (server, read-only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 3m
          script: |
            echo "== HEAD прод: $(git -C /opt/socialio rev-parse --short HEAD)"
            echo "== журнали nginx:"; ls -la /var/log/nginx/ 2>/dev/null | head -30
            echo "== формат: $(grep -h 'log_format\|access_log' /etc/nginx/nginx.conf /etc/nginx/sites-enabled/* 2>/dev/null | sort -u | head -8 | tr '\n' '|')"
            echo "== x-robots у nginx: $(grep -rih 'x-robots' /etc/nginx/ 2>/dev/null | head -3)"
            for bot in Googlebot bingbot YandexBot SeznamBot DuckDuckBot Applebot GPTBot ClaudeBot PerplexityBot; do
              n=$(zcat -f /var/log/nginx/access.log* 2>/dev/null | grep -c "$bot")
              echo "-- $bot: $n рядків (усі хости)"
            done
            echo "== Googlebot/bingbot останні 25 (дата, запит, код, хост якщо є):"
            zcat -f /var/log/nginx/access.log* 2>/dev/null | grep -E 'Googlebot|bingbot' | awk '{print $4, $6, $7, $9}' | tail -25
            echo "== holos-специфічні журнали:"
            for f in /var/log/nginx/*holos* ; do [ -e "$f" ] && echo "-- $f: Googlebot $(zcat -f $f* | grep -c Googlebot) · bingbot $(zcat -f $f* | grep -c bingbot)"; done
            echo "== ключі app_setting (лише назви):"
            cd /opt/socialio/server && docker compose exec -T db psql -U socialio -d socialio -Atc "select key from app_setting order by key" 2>/dev/null | sed 's/^/   /' || docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "select key from app_setting order by key"' | sed 's/^/   /'

  drop:
    if: github.event_name == 'workflow_dispatch' && inputs.link != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload media-drop via one-time link
        env:
          LINK: ${{ inputs.link }}
        run: |
          echo "::add-mask::$LINK"
          case "$LINK" in
            https://*/mcp/upload/*) ;;
            *) echo "не схоже на разове посилання заливки"; exit 1 ;;
          esac
          ls -la media-drop
          curl -fsS "$LINK/sh" -o holos-upload.sh
          sh holos-upload.sh media-drop
