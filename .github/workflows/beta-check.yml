name: beta-check

# Разова діагностика (запуск: push у гілку beta-check). Лише ЧИТАННЯ, нічого не змінює й не перезапускає.
# 28.09 вечір: токен колишнього спільного бота відкликано. Хто на проді й беті публікує в Telegram через
# спільного бота (без власного) і скільки людей зі спільним ботом у DM - кого це зачепило.

on:
  push:
    branches: [beta-check]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Who relies on the shared Telegram bot (read-only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 5m
          script: |
            mask() { sed -E -e 's/([A-Za-z0-9._%+-]{1,3})[A-Za-z0-9._%+-]*@([A-Za-z0-9.-]+)/\1***@\2/g' \
                            -e 's/[0-9]{6,}:[A-Za-z0-9_-]{30,}/<bot-token>/g' -e 's/[0-9a-fA-F]{24,}/<hex>/g'; }
            echo "зараз $(date -u +%d.%m\ %H:%M) UTC"
            for d in "${{ secrets.APP_DIR }}" "${{ secrets.APP_DIR }}-beta"; do
              echo; echo "=================== $d · HEAD $(git -C "$d" rev-parse --short HEAD) ==================="
              cd "$d/server" || continue
              docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -P pager=off -v ON_ERROR_STOP=0' <<'SQL' 2>&1 | mask
            set session characteristics as transaction read only;
            \echo === Telegram у всіх кабінетах: чий бот, канал, скільки вийшло за 30 днів, скільки чекає в календарі ===
            select coalesce(w.title, w.name) brand,
                   case when c.bot_token is null then 'спільний' else 'bot ' || split_part(c.bot_token, ':', 1) end bot,
                   coalesce(c.channel_title, case when c.channel_chat_id is null then '-' else 'без назви' end) channel,
                   (select count(*) from telegram_chat t where t.workspace_id=w.id) extra_chats,
                   (select count(*) from telegram_publish tp join post p on p.id=tp.post_id join pipeline_run r on r.id=p.run_id join source s on s.id=r.source_id
                     where s.workspace_id=w.id and tp.status='sent' and tp.created_at > now() - interval '30 days') sent_30d,
                   (select to_char(max(tp.created_at) at time zone 'Europe/Prague','DD.MM HH24:MI') from telegram_publish tp join post p on p.id=tp.post_id join pipeline_run r on r.id=p.run_id join source s on s.id=r.source_id
                     where s.workspace_id=w.id and tp.status='sent') last_sent,
                   (select count(*) from schedule_slot sl join post p on p.id=sl.post_id join pipeline_run r on r.id=p.run_id join source s on s.id=r.source_id
                     where s.workspace_id=w.id and sl.status='planned' and sl.scheduled_at > now() and coalesce(sl.channels, p.channels)->'telegram'->>'on' = 'true') planned_tg
              from telegram_config c join workspace w on w.id=c.workspace_id order by 2, 1;
            \echo === люди, підключені до бота в DM (tg_owner), за кабінетами ===
            select coalesce(w.title, w.name) brand, case when c.bot_token is null then 'спільний' else 'власний' end via, count(*) people,
                   to_char(max(o.created_at) at time zone 'Europe/Prague','DD.MM HH24:MI') last_connected
              from tg_owner o join workspace w on w.id=o.workspace_id left join telegram_config c on c.workspace_id=w.id
             group by 1, 2 order by 3 desc;
            SQL
            done
