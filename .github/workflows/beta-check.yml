name: beta-check

# Разова діагностика (запуск: push у гілку beta-check). Лише ЧИТАННЯ, нічого не змінює й не перезапускає.
# 28.09 після деплою 7ecd670: у threads_publish одна резервація 'sending' - чия, коли й що про неї в журналі.

on:
  push:
    branches: [beta-check]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Beta - whose Threads reservation is stuck in sending (read-only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 4m
          script: |
            mask() { sed -E -e 's/([A-Za-z0-9._%+-]{1,3})[A-Za-z0-9._%+-]*@([A-Za-z0-9.-]+)/\1***@\2/g' \
                            -e 's/EAA[A-Za-z0-9]{20,}/<meta-token>/g' -e 's/TH[A-Za-z0-9]{40,}/<th-token>/g'; }
            echo "beta HEAD $(git -C "${{ secrets.APP_DIR }}-beta" rev-parse --short HEAD) | зараз $(date -u +%H:%M) UTC"
            echo "health: $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/health)"
            cd "${{ secrets.APP_DIR }}-beta/server" && docker compose ps app --format '{{.Status}}'
            docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -P pager=off -v ON_ERROR_STOP=0' <<'SQL' 2>&1 | mask
            set session characteristics as transaction read only;
            \echo === незавершені резервації Threads: чиї й коли ===
            select left(tp.post_id::text,8) post, coalesce(w.title, w.name) brand, coalesce(tp.account_id,'-') acc, coalesce(tp.account_name,'-') acc_name,
                   to_char(tp.created_at at time zone 'Europe/Prague','DD.MM HH24:MI') created, tp.media_id,
                   (select count(*) from threads_publish t2 where t2.post_id=tp.post_id and t2.status='sent') sent_rows,
                   p.review, left(regexp_replace(p.content,'\s+',' ','g'),60) content
              from threads_publish tp join post p on p.id=tp.post_id join pipeline_run r on r.id=p.run_id join source s on s.id=r.source_id join workspace w on w.id=s.workspace_id
             where tp.status='sending';
            \echo === журнал про цей пост ===
            select to_char(l.created_at at time zone 'Europe/Prague','DD.MM HH24:MI:SS') t, l.level, l.scope, left(regexp_replace(l.message,'\s+',' ','g'),160) msg
              from app_log l where l.meta::text like '%' || (select post_id::text from threads_publish where status='sending' limit 1) || '%' order by l.created_at desc limit 10;
            SQL
