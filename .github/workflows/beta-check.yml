name: beta-check

# Службова гілка. Лише ЧИТАННЯ сервера (діагностика) або заливка файлів у медіатеку кабінету через його ж
# разове посилання. 29.09: бета після монтажу відео - версія, здоров'я, маркери і ПРОБНИЙ МОНТАЖ ffmpeg у
# контейнері беті (тимчасова тека, нічого не пише ні в базу, ні в медіатеку): чи є в Alpine-ffmpeg усі
# фільтри (ass, zoompan, boxblur, loudnorm, amix, tpad, сегментатор) і шрифт субтитрів. Другий прохід: ffmpeg 8
# відмовив «-vf crop=…» у пробі - чи працюють ті -vf, що їх викликає рушій (кадри для video_frames, рілс). Третій:
# причина - не ffmpeg 8, а stdin: скрипт іде в sh через stdin, і ffmpeg без -nostdin з'їдав його байти.
# Далі: стан Telegram-бота беті до і після деплою 60ae725 (бета бере свого спільного бота) - лише читання:
# id ботів (без токенів), куди веде вебхук (хост і вид шляху), рядки кабінетів, журнал tgbot.
# 30.09: під сповіщення про збої - які warn/error реально бувають за 30 днів (прод і бета), чи є куди слати
# (ADMIN_EMAILS, Resend, Telegram адміна), баланси провайдерів (OpenRouter, ElevenLabs, Deepgram - лише цифри),
# бекапи, диск і фільтри ffmpeg для переходів і музики. Нічого не пише.
# Далі - після деплою f475477: сповіщення (таблиці, рядки, налаштування), запасний маршрут (чи є ключ OpenAI -
# лише так/ні), привʼязка Telegram до акаунта (tg_owner.user_id - під вибір бренду в боті), пости з бота за 2 дні,
# монтажі й чи має ключ ElevenLabs право Music (навмисно кривий запит - нічого не генерує).
# Далі - після 9bee32a (бренд у боті): версія, здоров'я, код у контейнері, команди бота (getMyCommands), привʼязки,
# сповіщення й warn/error журналу за 20 хв.
# Далі - ПРОД після промоушну 455af3c (усе з беті): версія, health, сторінки, стара адреса, журнал старту, ffmpeg і шрифт,
# нові таблиці, бот (команди, вебхук), привʼязки, сповіщення, кількість даних і warn/error за 25 хв.
# Далі - бета: імʼя файлу змонтованого рілса про бетон (#91d1179b) і чи віддається він публічно - щоб скопіювати
# його у Vary Servis через upload_media конектора (рішення Олега в картці holos-bot-brand).
# Далі - бета після монтажу v3: версія, здоров'я, код у контейнері, колонка обкладинки, фільтри ffmpeg і проба
# libass у тимчасовій теці контейнера (гачок-плашка, субтитри на плашці, шторка) - у базу й медіатеку не пише.
# Далі - під примітки Олега в чек-листі 30.09: чи падає читання коментарів Threads (журнал), яка головна модель у
# кабінетах (OpenRouter чи OpenAI), Vary Servis (пояс, бриф, канали Telegram), нові акаунти для рецензента Meta,
# канали Telegram у брендах, чи є підключення YouTube/TikTok і чи задані їхні ключі (лише так/ні), тест сповіщень.
# Далі - після хотфіксу 761d958 (прод: політика й умови) і 3150429 (бета): сторінки, код у контейнері, тривоги й журнал.
# Далі - бета після коментарів у боті: версія, здоров'я, код у контейнері, таблиця comment_notice (скільки рядків за
# станом - чи пройшов перший прохід воркера), команди бота (getMyCommands), warn/error журналу. Нічого не пише.
# Далі - бета після YouTube і TikTok як мереж: версія, здоров'я, код у контейнері, представлення post_published і
# унікальні індекси «раз на пост», нові колонки, чи задано ключі Google/TikTok (лише так/ні), підключення й
# публікації YouTube/TikTok (лише кількості), warn/error журналу. Нічого не пише.
# Далі - бета після TikTok-перевірки (англійський режим ?review=tiktok, блок TikTok словами TikTok, «Новий пост»):
# версія, здоров'я, код у контейнері, колонка аватара, чи задано ключі TikTok і чи це sandbox (лише так/ні),
# підключення TikTok (кількість), warn/error журналу. Нічого не пише.
# Далі - ПРОД після промоушну cf505e3 (YouTube і TikTok як мережі, шлях до перевірки TikTok, коментарі в боті,
# монтаж v3, примітки 30.09): версія, health, сторінки, стара адреса, код і фільтри ffmpeg у контейнері, міграція
# (таблиці, колонки, індекси, post_published), ключі так/ні, бот (команди, вебхук), перший прохід коментарів,
# тривоги й warn/error журналу. Нічого не пише.

# 02.10 - сертифікат holos.rozum.one: Олег бачить «прострочений з 23.08». Що віддається ззовні (раннер, IPv4: DNS,
# ланцюжок, дати, історія з crt.sh) і на сервері по кожній адресі (IPv4 / IPv6 / без SNI), які файли сертифікатів
# підтягує nginx і їхні дати, certbot (сертифікати, таймер, журнал). Нічого не пише й не продовжує.
# Другий прохід: сам сертифікат holos дійсний до 27.12 - шукаємо «23.08» у ЛАНЦЮЖКУ (проміжний / крос-підпис), у
# старих випусках цього імені (archive), у UDP 443 (HTTP/3) і контейнерах; перевірка ланцюжка «по-старому» (-no_alt_chains).
# 03.10 - посилання на EvidujZdarma з holos (SEO): чи відкриваються https://evidujzdarma.cz/ і /musim-evidovat
# (код, редиректи, заголовок, h1, мова, robots, canonical, «připravujeme», чи є квіз і перевірка IČO) - лише з раннера.
# Далі - бета після посилань на EvidujZdarma: що реально віддає beta.holos (вхід за PIN беті, як у тестувальника) -
# блок «Від тієї ж команди», посилання без rel/UTM, підвали юридичних сторінок; прод поки без змін. Нічого не пише.
# Далі - ПРОД після промоушну 00f0508 (посилання на EvidujZdarma): що віддає holos.rozum.one ззовні (лендинг, юридичні
# сторінки, robots, sitemap, meta robots), стара адреса; на сервері - HEAD, контейнер, health. Нічого не пише.
# Далі - під індексацію holos (Search Console): хто тримає DNS rozum.one (NS, RDAP), чи є вже TXT-записи підтвердження
# Google/інших, заголовки X-Robots-Tag і meta robots сторінок, що знають пошуковики (DuckDuckGo/Bing site:), що роблять
# EvidujZdarma (robots, llms.txt, теги підтвердження - зразок), і чи заходять Googlebot/Bingbot (журнал nginx, лише боти).
# Далі - бета після 489ff36 (IndexNow, lastmod, robots, llms.txt, X-Robots-Tag): що віддає beta.holos (вхід за PIN),
# стан 'seo' у базі беті (дати, чи слали - бета не має), журнал seo. Нічого не пише.
# 07.10 - бета після команди бренду (ролі, запрошення): що віддає beta.holos (PIN-сторінка лишає адресу, запрошення
# без входу, команда без сесії), на сервері - версія, міграція (ролі учасників, таблиця запрошень, колонки постів),
# журнал. І ПРОД: карта сайту й robots очима Googlebot (Search Console пише «Не вдалось отримати») і чи заходили
# Googlebot/bingbot по карту після подання (журнал nginx, лише боти). Нічого не пише.
# Другий прохід - після деплою 07f3328 на бету: те саме, плюс чи лягла міграція команди (ролі, запрошення,
# колонки постів), PRO-конвеєр у коді контейнера і журнал після рестарту. Нічого не пише.
# 07.10 вечір - ПРОД після промоушну пошуковиків ff6048f (лише 489ff36 і документи, без команди бренду): що віддає
# holos.rozum.one ззовні (robots і його правила справжнім зіставленням, X-Robots-Tag і meta robots сторінок, llms.txt,
# sitemap з датами, стара адреса), на сервері - HEAD, контейнер, health, стан 'seo' у базі проду (дати сторінок, відповідь
# IndexNow), файл ключа ззовні (сам ключ у журнал не пишемо), хто його читав і які боти зайшли, журнал seo. Нічого не пише.

# 09.10 - під сторіс у Telegram (Telegram Business) і версії субтитрів: чи вміє ffmpeg у контейнері беті H.265
# (libx265), і пробне перекодування в те, що Telegram просить для сторіс (720×1280, HEVC, ключовий кадр щосекунди,
# MPEG4, ≤30 МБ) - у тимчасовій теці контейнера, нічого не пише ні в базу, ні в медіатеку. І чи прочиталися коментарі
# Threads після повторного входу Олега (картка holos-threads-relogin): журнал inbox/comments, лише рядки.
# Далі - бета після сторіс у Telegram і WhatsApp та мовних версій субтитрів: версія, здоров'я, код у контейнері,
# міграція (tg_business, tg_story_brand, whatsapp_publish, media_asset.sub_lang/variant_of, post_published з WhatsApp),
# спільний бот беті: чи слухає вебхук business_connection і чи ввімкнено Business Mode (getMe can_connect_to_business),
# підключення Business (кількості), warn/error журналу після рестарту. Нічого не пише.
# 10.10 - бета після 1d52c4a (свій бот людини без перехоплення + ідеї з її власних повідомлень): версія, здоров'я,
# код у контейнері, міграція (tg_relay, tg_chat_note), відповіді входу /api/webhooks/telegram/relay/<id> на чужий
# секрет і кривий id (401/404 - нічого не пише), рядки tg_relay (кількість), журнал. І бот Олега (networking-ai на
# цьому ж боксі): де він, на якому коміті, чи задано HOLOS_RELAY_URL (лише так/ні) і чи достукується його контейнер
# до beta.holos (POST з чужим секретом - очікуємо 401). Нічого не пише й не перезапускає.
# Другий прохід - після деплою бота Олега (3847624, «так, бот»): чи бот уже стукає в Holos (nginx беті: запити на
# /api/webhooks/telegram/relay/ - час і код відповіді), рядки tg_relay (нік, чи ідеї, коли писав), підключення Business
# цього бота і профіль бренду, черга думок, журнал tgrelay за 3 год. Нічого не пише.
# Третій - бета після a68af00 (👥 питання клієнтів, окрема галочка): версія, здоров'я, код у контейнері, міграція
# (tg_relay.client_ideas, tg_chat_note.who), стан свого бота (галочки, коли писав), черга за видом, журнал. Нічого не пише.
# 10.10 вечір - ПРОД після промоушну 45c126e (команда бренду, сторіс Telegram/WhatsApp і мови субтитрів, свій бот без
# перехоплення й ідеї, питання клієнтів, конектор не затирає мережі поста): версія, health, сторінки, стара адреса, код у
# контейнері, міграція (ролі учасників, нові таблиці й колонки, post_published з WhatsApp), вхід relay (401/404), бот
# (getMe can_connect_to_business, вебхук і allowed_updates), дані й warn/error журналу. Нічого не пише.

on:
  push:
    branches: [beta-check]
  workflow_dispatch:
    inputs:
      link:
        description: "Разове посилання для заливки (https://…/mcp/upload/…)"
        required: false
        default: ""
# 10.10 (вечір) - бета після медіатеки окремою сторінкою (6e2339c): версія, здоров'я, код у контейнері, нові колонки
# media_asset, скільки файлів у якому стані й скільки відклав автоархів (по кабінетах, без назв), журнал medialib. І скільки
# місця реально займають медіа: прод і бета (за типом і джерелом, томи, бекапи, диск) - під питання Олега про Telegram як сховище.
# Нічого не пише (автоархів робить сам застосунок беті - це його звичайна робота).

jobs:
  beta:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: beta after media library (server, read-only) + media disk usage prod and beta
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 8m
          script: |
            cd /opt/socialio-beta/server
            for i in $(seq 1 48); do
              up=$(( $(date +%s) - $(date -d "$(docker inspect -f '{{.State.StartedAt}}' $(docker compose ps -q app))" +%s) ))
              [ "$up" -ge 150 ] && break; sleep 5
            done
            echo "зараз $(date -u +%d.%m\ %H:%M) UTC · контейнер беті живе ${up} с"
            echo "HEAD бета $(git -C .. rev-parse --short HEAD) · прод $(git -C /opt/socialio rev-parse --short HEAD)"
            docker compose ps --format '{{.Name}} {{.Status}}'
            P=$(grep -E '^APP_PORT=' .env | cut -d= -f2); P=${P:-8081}
            curl -s -o /dev/null -w "health %{http_code}\n" http://127.0.0.1:$P/health
            echo "медіатека без входу: $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:$P/api/media/library)"
            docker compose exec -T app sh -c 'for m in dist/medialib.js:archiveSweepWorkspace dist/medialib-plan.js:mediaUsage dist/mcp.js:update_media dist/montage.js:made_from dist/lifecycle.js:archiveSweep public/app.js:renderMlList public/app.js:mlArchDays public/app.html:layMedia; do f=${m%%:*}; k=${m#*:}; echo "   $f $k: $(grep -c "$k" $f 2>/dev/null || echo 0)"; done'
            JS=$(cat <<'EOF'
            const { q } = await import('/app/dist/db.js');
            const cols = await q("select string_agg(column_name, ',' order by column_name) c from information_schema.columns where table_name='media_asset' and column_name in ('title','archived_at','archived_by','archive_keep','made_from')");
            console.log('нові колонки media_asset: ' + cols[0].c);
            const hid = ['ig-safe','ai-base','slide','cover','montage-lang','crop'];
            const k = await q("select kind, count(*) filter (where source <> all($1::text[]))::int lib, count(*)::int alls, round(coalesce(sum(size),0)/1048576.0)::int mb from media_asset group by 1 order by 1", [hid]);
            console.log('бета медіа (у медіатеці / усього з копіями / МБ): ' + k.map((x) => x.kind + ' ' + x.lib + '/' + x.alls + '/' + x.mb).join(' · '));
            const s = await q("select source, count(*)::int n, round(coalesce(sum(size),0)/1048576.0)::int mb from media_asset group by 1 order by 3 desc");
            console.log('бета за джерелом (шт / МБ): ' + s.map((x) => x.source + ' ' + x.n + '/' + x.mb).join(' · '));
            const a = await q("select coalesce(archived_by,'-') b, count(*)::int n from media_asset where archived_at is not null group by 1");
            console.log('в архіві: ' + (a.map((x) => x.b + ' ' + x.n).join(' · ') || '0'));
            const ml = await import('/app/dist/medialib.js');
            const wss = await q("select distinct workspace_id w from media_asset");
            for (const w of wss) {
              const it = await ml.libraryItems(w.w); const st = {};
              for (const x of it) { const key = x.archived_at ? 'archived' : x.state; st[key] = (st[key] || 0) + 1; }
              console.log('  кабінет …' + String(w.w).slice(-4) + ': ' + it.length + ' файлів · ' + Object.entries(st).map(([a, b]) => a + ' ' + b).join(' · ') + ' · автоархів ' + (await ml.archiveDays(w.w)) + ' дн.');
            }
            const lg = await q("select level, scope, left(message,170) m, to_char(created_at at time zone 'UTC','HH24:MI') c from app_log where created_at > now() - interval '20 minutes' and (scope='medialib' or level in ('warn','error')) order by created_at desc limit 12");
            for (const l of lg) console.log('  ' + l.c + ' ' + l.level[0] + ' ' + l.scope + ': ' + String(l.m).replace(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/g, '***'));
            if (!lg.length) console.log('журнал за 20 хв: нічого');
            process.exit(0);
            EOF
            )
            docker compose exec -T app node --input-type=module -e "$JS" 2>&1 | tail -30
            echo "--- прод (лише читання): скільки займають медіа"
            cd /opt/socialio/server
            PJS=$(cat <<'EOF'
            const { q } = await import('/app/dist/db.js');
            const k = await q("select kind, count(*)::int n, round(coalesce(sum(size),0)/1048576.0)::int mb from media_asset group by 1 order by 1");
            console.log('прод медіа (шт / МБ): ' + k.map((x) => x.kind + ' ' + x.n + '/' + x.mb).join(' · '));
            const s = await q("select source, count(*)::int n, round(coalesce(sum(size),0)/1048576.0)::int mb from media_asset group by 1 order by 3 desc");
            console.log('прод за джерелом: ' + s.map((x) => x.source + ' ' + x.n + '/' + x.mb).join(' · '));
            process.exit(0);
            EOF
            )
            docker compose exec -T app node --input-type=module -e "$PJS" 2>&1 | tail -5
            echo "--- диск"
            for v in socialio_media socialio-beta_media socialio_pgdata socialio-beta_pgdata; do d=$(docker volume inspect -f '{{.Mountpoint}}' $v 2>/dev/null); [ -n "$d" ] && echo "   том $v: $(du -sh "$d" 2>/dev/null | cut -f1)"; done
            echo "   бекапи: $(du -sh /opt/socialio-backups 2>/dev/null | cut -f1)"
            df -h / | tail -1 | awk '{print "   диск /: усього " $2 ", зайнято " $3 " (" $5 "), вільно " $4}'

  drop:
    if: github.event_name == 'workflow_dispatch' && inputs.link != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload media-drop via one-time link
        env:
          LINK: ${{ inputs.link }}
        run: |
          echo "::add-mask::$LINK"
          case "$LINK" in
            https://*/mcp/upload/*) ;;
            *) echo "не схоже на разове посилання заливки"; exit 1 ;;
          esac
          ls -la media-drop
          curl -fsS "$LINK/sh" -o holos-upload.sh
          sh holos-upload.sh media-drop
