name: socialio

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # БД не публікуємо назовні — лише у внутрішню мережу compose
    expose:
      - "5432"

  # RSSHub: генератор RSS зі сторінок соцмереж (Telegram-канали через публічне t.me/s).
  # БЕЗ published ports - доступний ЛИШЕ з внутрішньої мережі compose (app → http://rsshub:1200).
  # Легкий образ без chromium (для Telegram puppeteer не потрібен); mem_limit - страховка RAM сервера.
  rsshub:
    image: diygod/rsshub
    restart: unless-stopped
    environment:
      NODE_ENV: production
      CACHE_EXPIRE: "600"
      CACHE_CONTENT_EXPIRE: "3600"
    mem_limit: 400m
    expose:
      - "1200"

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      # назовні віддаємо через reverse proxy (nginx). APP_PORT з .env: прод 8080 (дефолт), бета 8081.
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      - media:/app/media        # завантажені фото/відео — переживають деплої

volumes:
  pgdata:
  media:
